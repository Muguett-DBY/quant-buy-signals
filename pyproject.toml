[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-dcf"
version = "11.2.0"
description = "A-share multi-model valuation and seven-framework screening tool"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy==2.4.6",
  "pandas==3.0.3",
  "plotly==6.9.0",
  "pillow==12.3.0",
  "requests==2.34.2",
  "streamlit==1.59.2",
  "orjson==3.11.9",
]

[tool.setuptools]
py-modules = ["app", "config"]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "desktop*", "engine*", "ui*", "tools*"]
exclude = ["tests*", "audit*", ".reasonix*"]
namespaces = true

[tool.setuptools.package-data]
data = [
  "industry_f10.json",
  "industry_em_map.json",
  "industry_capco_2025h2.json",
  "industry_exchange_new_listings_2026.json",
  "financial_zero_revenue_evidence.json",
  "financial_zero_capex_evidence.json",
  "financial_balance_sheet_evidence.json",
]
desktop = ["update_config.json", "version_info.txt", "DS_DCF.spec", "DS_DCF_Installer.spec"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "*.pyo", "*.pkl", "*.parquet", "cache/*", ".reasonix/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -p no:cacheprovider"
filterwarnings = [
  "error::RuntimeWarning",
  "ignore:.*missing ScriptRunContext.*:UserWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["data/cache", ".reasonix"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B905"]

[tool.ruff.format]
line-ending = "lf"

[tool.coverage.run]
branch = true
source = ["data", "engine", "ui", "tools"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 75
