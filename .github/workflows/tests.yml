name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
          - python-version: "3.12"
          - python-version: "3.13"
          - python-version: "3.14"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-bootstrap.txt
          python -m pip install --require-hashes -r requirements-dev-lock.txt
          python -m pip check

      - name: Validate line-ending policy
        shell: pwsh
        run: |
          $lfExtensions = @('.py', '.pyi', '.js', '.jsx', '.ts', '.tsx', '.css', '.scss', '.html', '.sh', '.ps1', '.md', '.json', '.jsonl', '.yaml', '.yml', '.toml', '.spec', '.txt', '.xml', '.csv')
          $lfNames = @('.gitignore', '.gitattributes', 'license')
          $violations = @()
          git ls-files --eol | ForEach-Object {
            $parts = $_ -split "`t", 2
            if ($parts.Count -ne 2) { return }
            $metadata = $parts[0]
            $path = $parts[1]
            $extension = [IO.Path]::GetExtension($path).ToLowerInvariant()
            $name = [IO.Path]::GetFileName($path).ToLowerInvariant()
            if (($lfExtensions -contains $extension) -or ($lfNames -contains $name)) {
              if ($metadata -notmatch '^(?:i/lf\s+w/lf|i/none\s+w/none)\s+attr/text eol=lf\s*$') {
                $violations += "$path => $metadata (expected LF)"
              }
            } elseif ($extension -in @('.bat', '.cmd')) {
              if ($metadata -notmatch '^i/lf\s+w/crlf\s+attr/text eol=crlf\s*$') {
                $violations += "$path => $metadata (expected CRLF working tree, LF index)"
              }
            }
          }
          if ($violations) {
            $violations | ForEach-Object { Write-Error "Line-ending policy violation: $_" }
            exit 1
          }

      - name: Reject tracked runtime and internal artifacts
        shell: pwsh
        run: |
          $forbidden = git ls-files | Where-Object {
            $_ -match '(^|/)__pycache__/' -or
            $_ -match '\.py[co]$' -or
            $_ -match '^\.reasonix/' -or
            $_ -match '^\.(agents|codex)/' -or
            $_ -match '(^|/)\.(pytest_cache|ruff_cache|mypy_cache|playwright-cli)/' -or
            ($_ -match '^data/cache/' -and $_ -ne 'data/cache/.gitkeep') -or
            $_ -match '\.(pkl|pickle|parquet|log|tmp|bak|zip|7z)$' -or
            $_ -match '(^|/)(coverage\.xml|cache\.db)$' -or
            $_ -match '(^|/)\.coverage(?:\..*)?$' -or
            $_ -match '(^|/)(htmlcov|dist|build)/' -or
            $_ -match '(^|/)[^/]+\.egg-info/' -or
            $_ -match '(^|/)\.streamlit/secrets\.toml$' -or
            (($_ -match '(^|/)\.env(?:\..+)?$') -and ($_ -notmatch '\.(example|sample|template)$')) -or
            $_ -match '\.(pem|key|p12|pfx)$' -or
            $_ -match '(^|/)id_(rsa|dsa|ecdsa|ed25519)$'
          }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error "Tracked runtime artifact: $_" }
            exit 1
          }

      - name: Unit and integration tests with coverage
        if: matrix.python-version == '3.12'
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=75

      - name: Unit and integration tests
        if: matrix.python-version != '3.12'
        run: python -m pytest

      - name: Lint and formatting checks
        if: matrix.python-version == '3.12'
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Security and dependency checks
        if: matrix.python-version == '3.12'
        run: |
          python -m bandit -q -r app.py config.py data desktop engine ui tools --severity-level medium --confidence-level medium
          python -m pip_audit --strict --progress-spinner off --require-hashes -r requirements-lock.txt
          python -m pip_audit --strict --progress-spinner off --require-hashes -r requirements-dev-lock.txt
          python -m pip check

      - name: Build and verify wheel package data
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          python -m build --wheel --no-isolation
          if ($LASTEXITCODE -ne 0) { throw "Wheel build failed with exit code $LASTEXITCODE" }
          $wheels = @(Get-ChildItem -LiteralPath dist -Filter '*.whl')
          if ($wheels.Count -ne 1) {
            throw "Expected exactly one wheel, found $($wheels.Count)"
          }
          $target = Join-Path $env:RUNNER_TEMP 'ds-dcf-wheel-check'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          python -m pip install --no-deps --target $target $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "Wheel installation failed with exit code $LASTEXITCODE" }
          $oldPythonPath = $env:PYTHONPATH
          try {
            $env:PYTHONPATH = $target
            Push-Location $env:RUNNER_TEMP
            python -c "from data.industry import industry_data_status; import tools.run_full_audit; status = industry_data_status(); assert status['loader_ok'], status; assert status['f10_entries'] > 0, status; assert status['authoritative_records'] >= 5000, status; assert status['authoritative_source']['source_sha256'], status"
            if ($LASTEXITCODE -ne 0) { throw "Installed wheel verification failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
            $env:PYTHONPATH = $oldPythonPath
          }

      - name: Build and smoke-test Windows desktop release
        if: matrix.python-version == '3.12'
        run: python -m tools.build_desktop

      - name: Verify tracked desktop source archive
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          $audit = 'audit/random100_audit_seed20260715.json'
          if (-not (Test-Path -LiteralPath $audit)) {
            Write-Host 'No tracked release audit yet; desktop archive verification is deferred.'
            exit 0
          }
          $root = Join-Path $env:RUNNER_TEMP 'ds-dcf-source-package'
          $package = Join-Path $root 'DS_DCF-v11.0.0'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          git ls-files | ForEach-Object {
            $source = Join-Path $PWD $_
            $destination = Join-Path $package $_
            New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
            Copy-Item -LiteralPath $source -Destination $destination
          }
          $zip = Join-Path $env:RUNNER_TEMP 'DS_DCF-v11.0.0.zip'
          Compress-Archive -LiteralPath $package -DestinationPath $zip -CompressionLevel Optimal
          python -m tools.verify_release_zip $zip
