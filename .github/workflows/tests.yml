name: tests

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify website changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.paths.outputs.web }}
      data: ${{ steps.paths.outputs.data }}
      ai: ${{ steps.paths.outputs.ai }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select required website gates
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            python .github/scripts/classify_website_ci.py --all --github-output "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${EVENT_NAME}" == "push" && "${REF_NAME}" == "refs/heads/main" ]]; then
            # Main has no server-side required checks.  A narrow push may use
            # the same path-aware gates as a PR only after the immediately
            # preceding revision has a successful tests run.  If that proof is
            # unavailable, run all gates so a small follow-up
            # cannot hide an older data-integrity failure.
            if [[ ! "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid head revision: ${HEAD_SHA}" >&2
              exit 1
            fi
            if [[ ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || [[ "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "${BASE_SHA}^{commit}"; then
              echo "No bounded main base revision is available; running all website gates."
              python .github/scripts/classify_website_ci.py --all --github-output "${GITHUB_OUTPUT}"
              exit 0
            fi
            previous_tests_ok=""
            for attempt in 1 2 3 4; do
              if previous_tests_ok="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${BASE_SHA}&event=push&per_page=100" \
                --jq '[.workflow_runs[] | select(.name == "tests" and .conclusion == "success")] | length > 0' 2>/dev/null)" \
                && [[ "${previous_tests_ok}" == "true" || "${previous_tests_ok}" == "false" ]]; then
                break
              fi
              previous_tests_ok=""
              sleep $((attempt * 2))
            done
            if [[ "${previous_tests_ok}" != "true" ]]; then
              echo "Previous main revision has no confirmed successful tests run; running all website gates."
              python .github/scripts/classify_website_ci.py --all --github-output "${GITHUB_OUTPUT}"
              exit 0
            fi
            changed_file="${RUNNER_TEMP}/website-changed-files.txt"
            git diff --no-renames --name-only "${BASE_SHA}" "${HEAD_SHA}" -- > "${changed_file}"
            python .github/scripts/classify_website_ci.py --github-output "${GITHUB_OUTPUT}" < "${changed_file}"
            echo "Main push has a verified base; using path-aware website CI classification:"
            cat "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ ! "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid head revision: ${HEAD_SHA}" >&2
            exit 1
          fi
          if [[ ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || [[ "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "${BASE_SHA}^{commit}"; then
            echo "No bounded base revision is available; running all website gates."
            python .github/scripts/classify_website_ci.py --all --github-output "${GITHUB_OUTPUT}"
            exit 0
          fi
          changed_file="${RUNNER_TEMP}/website-changed-files.txt"
          git diff --no-renames --name-only "${BASE_SHA}" "${HEAD_SHA}" -- > "${changed_file}"
          python .github/scripts/classify_website_ci.py --github-output "${GITHUB_OUTPUT}" < "${changed_file}"
          echo "Website CI classification:"
          cat "${GITHUB_OUTPUT}"

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Validate tracked files and line endings
        shell: pwsh
        run: |
          $lfExtensions = @('.py', '.pyi', '.js', '.jsx', '.ts', '.tsx', '.css', '.scss', '.html', '.sh', '.ps1', '.md', '.json', '.jsonl', '.yaml', '.yml', '.toml', '.spec', '.txt', '.xml', '.csv', '.java', '.kt', '.kts', '.properties')
          $lfNames = @('.gitignore', '.gitattributes', 'license')
          $violations = @()
          git ls-files --eol | ForEach-Object {
            $parts = $_ -split "`t", 2
            if ($parts.Count -ne 2) { return }
            $metadata = $parts[0]
            $path = $parts[1]
            $extension = [IO.Path]::GetExtension($path).ToLowerInvariant()
            $name = [IO.Path]::GetFileName($path).ToLowerInvariant()
            if (($lfExtensions -contains $extension) -or ($lfNames -contains $name)) {
              if ($metadata -notmatch '^(?:i/lf\s+w/lf|i/none\s+w/none)\s+attr/text eol=lf\s*$') {
                $violations += "$path => $metadata (expected LF)"
              }
            } elseif ($extension -in @('.bat', '.cmd')) {
              if ($metadata -notmatch '^i/lf\s+w/crlf\s+attr/text eol=crlf\s*$') {
                $violations += "$path => $metadata (expected CRLF working tree, LF index)"
              }
            }
          }
          if ($violations) {
            $violations | ForEach-Object { Write-Error "Line-ending policy violation: $_" }
            exit 1
          }

          $forbidden = git ls-files | Where-Object {
            $_ -match '(^|/)__pycache__/' -or
            $_ -match '\.py[co]$' -or
            $_ -match '^\.reasonix/' -or
            $_ -match '^\.(agents|codex)/' -or
            $_ -match '(^|/)\.(pytest_cache|ruff_cache|mypy_cache|playwright-cli)/' -or
            ($_ -match '^data/cache/' -and $_ -ne 'data/cache/.gitkeep') -or
            $_ -match '\.(pkl|pickle|parquet|log|tmp|bak|zip|7z)$' -or
            $_ -match '(^|/)(coverage\.xml|cache\.db)$' -or
            $_ -match '(^|/)\.coverage(?:\..*)?$' -or
            $_ -match '(^|/)(htmlcov|dist|build)/' -or
            $_ -match '(^|/)[^/]+\.egg-info/' -or
            $_ -match '(^|/)\.streamlit/secrets\.toml$' -or
            (($_ -match '(^|/)\.env(?:\..+)?$') -and ($_ -notmatch '\.(example|sample|template)$')) -or
            $_ -match '\.(pem|key|der|pk8|pkcs8|p8|ppk|p12|pfx|jks|keystore)$' -or
            $_ -match '(^|/)[^/]+-(signing-private-key|release-credentials)\.properties$' -or
            $_ -match '(^|/)android/release\.properties$' -or
            $_ -match '(^|/)id_(rsa|dsa|ecdsa|ed25519)$'
          }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error "Tracked runtime artifact: $_" }
            exit 1
          }

  web:
    name: Fast Cloudflare web gate
    needs: classify
    if: needs.classify.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install web contract dependencies
        run: python -m pip install --quiet pytest==9.1.1 pyyaml==6.0.3 pymupdf==1.28.0

      - name: Worker syntax and website contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-cron/worker.js
          node --check cloudflare/quant-dashboard/pages_worker.js
          node --check cloudflare/quant-dashboard/refresh_worker.js
          python -m pytest tests/test_cloudflare_dashboard.py tests/test_website_ci.py -q

  ai:
    name: Fast AI screening contract gate
    needs: classify
    if: needs.classify.outputs.ai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install AI contract dependencies
        run: python -m pip install --quiet pytest==9.1.1 pyyaml==6.0.3 pymupdf==1.28.0 ruff==0.15.21

      - name: AI unit and contract tests
        shell: bash
        run: |
          set -euo pipefail
          # Keep the checked-in, generation-bound seed out of the fixture
          # lane. Publication owns the release-artifact checks.
          python -m pytest \
            tests/test_ai_screening_contract.py \
            tests/test_ai_screening_narrative.py \
            tests/test_ai_screening_comparison.py \
            tests/test_validate_ai_screening_public.py \
            tests/test_convert_luna_web_reviews.py \
            tests/test_ai_screening_release_contract.py \
            tests/test_ai_screening_source_audit.py \
            tests/test_ai_screening_identity_audit.py \
            tests/test_calibrate_ai_screening_ranking.py \
            tests/test_build_codex_luna_review.py \
            tests/test_ai_screening_dual_channel_contract.py \
            tests/test_sanitize_codex_luna_reviews.py \
            tests/test_assemble_ai_screening_reviews.py \
            tests/test_merge_ai_screening_reviews.py \
            tests/test_atomic_io.py \
            tests/test_ai_quantitative_facts.py \
            tests/test_ai_screening_websearch_events.py \
            tests/test_local_ai_review.py \
            tests/test_shard_ai_screening_candidates.py \
            tests/test_website_ci.py \
            -m "not ai_release" -q
          python -m ruff check .github/scripts/classify_website_ci.py tools tests
          python -m ruff format --check .github/scripts/classify_website_ci.py tools tests
          python -m pip check

  data:
    name: Website data-integrity gate
    needs: classify
    if: needs.classify.outputs.data == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-bootstrap.txt
          python -m pip install --require-hashes -r requirements-dev-lock.txt
          python -m pip check

      - name: Website Python tests
        run: >-
          python -m pytest
          --ignore=tests/test_android_release.py
          --ignore=tests/test_build_desktop.py
          --ignore=tests/test_desktop_installer.py
          --ignore=tests/test_desktop_launcher.py
          --ignore=tests/test_desktop_updater.py
          --ignore=tests/test_streamlit_app.py
          --ignore=tests/test_ui.py
          -m "not desktop and not android and not parked_client and not ai_release"
          --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=75

      - name: Lint and formatting checks
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Security and website runtime dependency checks
        run: |
          python -m bandit -q -r config.py data engine tools --severity-level medium --confidence-level medium
          python -m pip_audit --strict --progress-spinner off --require-hashes --disable-pip --timeout 30 -r requirements-lock.txt
          python -m pip check

  website-ci:
    name: Website release gate
    needs: [classify, hygiene, web, data, ai]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected website gate
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
          WEB_REQUIRED: ${{ needs.classify.outputs.web }}
          WEB_RESULT: ${{ needs.web.result }}
          DATA_REQUIRED: ${{ needs.classify.outputs.data }}
          DATA_RESULT: ${{ needs.data.result }}
          AI_REQUIRED: ${{ needs.classify.outputs.ai }}
          AI_RESULT: ${{ needs.ai.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CLASSIFY_RESULT}" != "success" ]]; then
            echo "Changed-file classification did not succeed." >&2
            exit 1
          fi
          if [[ "${HYGIENE_RESULT}" != "success" ]]; then
            echo "Repository hygiene did not succeed." >&2
            exit 1
          fi
          if [[ "${WEB_REQUIRED}" != "true" && "${WEB_REQUIRED}" != "false" ]]; then
            echo "Cloudflare gate selection is invalid: ${WEB_REQUIRED:-missing}." >&2
            exit 1
          fi
          if [[ "${DATA_REQUIRED}" != "true" && "${DATA_REQUIRED}" != "false" ]]; then
            echo "Data-integrity gate selection is invalid: ${DATA_REQUIRED:-missing}." >&2
            exit 1
          fi
          if [[ "${AI_REQUIRED}" != "true" && "${AI_REQUIRED}" != "false" ]]; then
            echo "AI screening gate selection is invalid: ${AI_REQUIRED:-missing}." >&2
            exit 1
          fi
          if [[ "${WEB_REQUIRED}" == "true" && "${WEB_RESULT}" != "success" ]]; then
            echo "The selected Cloudflare web gate finished as ${WEB_RESULT}." >&2
            exit 1
          fi
          if [[ "${DATA_REQUIRED}" == "true" && "${DATA_RESULT}" != "success" ]]; then
            echo "The selected website data-integrity gate finished as ${DATA_RESULT}." >&2
            exit 1
          fi
          if [[ "${AI_REQUIRED}" == "true" && "${AI_RESULT}" != "success" ]]; then
            echo "The selected AI screening gate finished as ${AI_RESULT}." >&2
            exit 1
          fi
          echo "All selected website gates passed."
