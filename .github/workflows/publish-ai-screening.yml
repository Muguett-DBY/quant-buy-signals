name: publish ai screening

# The AI overlay is a generation-bound R2 object consumed by the already
# deployed Pages worker.  It has its own short website-only gate and must not
# wait for the repository's full data/software test matrix.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - cloudflare/quant-dashboard/ai_screening_seed.json

permissions:
  contents: read

concurrency:
  group: publish-ai-screening-main
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_VERSION: 4.118.0
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Skip a superseded main revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          remote=""
          for attempt in 1 2 3 4; do
            remote="$(git ls-remote origin refs/heads/main 2>/dev/null | awk '{print $1}')" || true
            if [[ "${remote}" =~ ^[0-9a-f]{40}$ ]]; then
              break
            fi
            sleep $((attempt * 2))
          done
          if [[ ! "${remote}" =~ ^[0-9a-f]{40}$ || "${remote}" != "${GITHUB_SHA}" ]]; then
            echo "current=false" >> "${GITHUB_OUTPUT}"
            echo "AI publication revision ${GITHUB_SHA:0:12} was superseded or remote main could not be confirmed; skipping without publishing."
            exit 0
          fi
          echo "current=true" >> "${GITHUB_OUTPUT}"

      - name: Install the AI website gate dependencies
        if: steps.revision.outputs.current == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt

      - name: Run the AI-only contract gate
        if: steps.revision.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest==9.1.1 pyyaml==6.0.3 pymupdf==1.28.0
          python -m pytest \
            tests/test_ai_screening_contract.py \
            tests/test_ai_screening_narrative.py \
            tests/test_ai_screening_comparison.py \
            tests/test_validate_ai_screening_public.py \
            tests/test_convert_luna_web_reviews.py \
            tests/test_ai_screening_release_contract.py \
            tests/test_ai_screening_source_audit.py \
            tests/test_ai_screening_identity_audit.py \
            tests/test_calibrate_ai_screening_ranking.py \
            tests/test_build_codex_luna_review.py \
            tests/test_ai_screening_dual_channel_contract.py \
            tests/test_sanitize_codex_luna_reviews.py \
            tests/test_assemble_ai_screening_reviews.py \
            tests/test_merge_ai_screening_reviews.py \
            tests/test_atomic_io.py \
            tests/test_ai_quantitative_facts.py \
            tests/test_ai_screening_websearch_events.py \
            tests/test_local_ai_review.py \
            tests/test_shard_ai_screening_candidates.py \
            tests/test_website_ci.py \
            -q
          python -m pip check

      - name: Validate the seed against the live market generation
        id: preflight
        if: steps.revision.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          seed="cloudflare/quant-dashboard/ai_screening_seed.json"
          test -s "${seed}"
          generation="$(jq -er '.snapshot_generation' "${seed}")"
          market_as_of="$(jq -er '.market_as_of' "${seed}")"
          [[ "${generation}" =~ ^[0-9a-f]{16}$ ]]
          [[ "${market_as_of}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          live_meta=""
          for attempt in 1 2 3 4 5; do
            if live_meta="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              --retry 3 --retry-all-errors --retry-delay 2 https://quant.custard.top/api/meta 2>/dev/null)" \
              && jq -e '.generation_id and .market_as_of' <<< "${live_meta}" >/dev/null; then
              break
            fi
            live_meta=""
            sleep $((attempt * 2))
          done
          test -n "${live_meta}"
          live_generation="$(jq -er '.generation_id' <<< "${live_meta}")"
          live_market_as_of="$(jq -er '.market_as_of' <<< "${live_meta}")"
          echo "stale=false" >> "${GITHUB_OUTPUT}"
          if [[ "${live_generation}" != "${generation}" || "${live_market_as_of}" != "${market_as_of}" ]]; then
            echo "stale=true" >> "${GITHUB_OUTPUT}"
            echo "AI seed ${generation}/${market_as_of} is older than the live market generation ${live_generation}/${live_market_as_of}; leaving the generation-bound overlay unchanged."
            exit 0
          fi
          python -m tools.validate_ai_screening_public \
            --artifact "${seed}" \
            --expected-generation "${generation}" \
            --expected-market-as-of "${market_as_of}"
          python -m tools.audit_ai_screening_full \
            --artifact "${seed}" \
            --expected-generation "${generation}" \
            --expected-market-as-of "${market_as_of}" \
            --expected-count "$(jq -er '.candidate_total' "${seed}")"
          review_mode="$(jq -er '.review_mode' "${seed}")"
          if [[ "${review_mode}" == "local_codex_review" ]]; then
            jq -e '
              .review_mode == "local_codex_review"
              and .full_coverage_final_recommendation == true
              and .candidate_offset == 0
              and .reviewed_count == .candidate_total
              and .type_pair_reviewed_count == .type_pair_candidate_total
              and .type_pair_unreviewed_count == 0
              and .insufficient_evidence_count == 0
              and (.recommend_buy_count + .do_not_recommend_buy_count == .candidate_total)
            ' "${seed}" >/dev/null
          else
            jq -e '
              .review_mode == "codex_luna_web_review"
            and .full_coverage_final_recommendation == true
            and .candidate_offset == 0
            and .reviewed_count == .candidate_total
            and .type_pair_reviewed_count == .type_pair_candidate_total
            and .type_pair_unreviewed_count == 0
            and .insufficient_evidence_count == 0
            and (.recommend_buy_count + .do_not_recommend_buy_count == .candidate_total)
            and .web_search_attempted_count == .candidate_total
            and .web_search_event_verified_count == .candidate_total
            and .web_search_claim_urls_verified_count == .candidate_total
            and .reviewed_without_web_search == 0
            and .full_coverage_web_search == true
            and .type_pair_web_search_attempted_count == .type_pair_candidate_total
            and .type_pair_web_search_event_verified_count == .type_pair_candidate_total
            and .type_pair_web_search_claim_urls_verified_count == .type_pair_candidate_total
            and .research_source_urls_verified_count == .candidate_total
            and .type_pair_research_source_urls_verified_count == .type_pair_candidate_total
            and .source_audit.available == true
            and .source_audit.audit_contract_version == 4
            and .source_audit.audit_passed == true
            and (.source_audit.audit_sha256 | test("^[0-9a-f]{64}$"))
            and (.source_audit.merged_sha256 | test("^[0-9a-f]{64}$"))
            and (.source_audit.projection_sha256 | test("^[0-9a-f]{64}$"))
            and .source_audit.projection_company_count == .candidate_total
            and .source_audit.failed == 0
            and .source_audit.blocked == 0
            and .source_audit.invalid_claim_url_count == 0
            and .source_audit.semantic_failed_count == 0
            and .source_audit.semantic_unverified_count == 0
            and .source_audit.semantic_passed_count == .source_audit.semantic_claim_count
            and .source_audit.company_pass_count == .candidate_total
            and .source_audit.company_failed_count == 0
            and .source_audit.company_unverified_count == 0
            and .source_audit.affected_company_count == 0
            and .source_audit.network_warnings_allowed == false
            and .source_audit.release_status == "passed"
            and (.source_audit.company_coverage | length) == .candidate_total
            and all(.source_audit.company_coverage[];
              .status == "pass"
              and .semantic_failed_count == 0
              and .semantic_unverified_count == 0
              and .semantic_passed_count == .semantic_claim_count)
            and all(.packets[];
              .ai_review.source_verification_status == "pass"
              and .ai_review.source_verification_issue_count == 0
              and .ai_review.source_verification_issues == []
              and .ai_review.source_verification_issue_kinds == {})
          ' "${seed}" >/dev/null
          fi
          echo "generation=${generation}" >> "${GITHUB_OUTPUT}"

      - name: Upload the AI overlay to its generation-bound R2 object
        id: overlay
        if: steps.revision.outputs.current == 'true' && steps.preflight.outputs.stale != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          object="quant-market-data/ai-screening/${{ steps.preflight.outputs.generation }}.json"
          backup="${RUNNER_TEMP}/previous-ai-screening.json"
          echo "previous=false" >> "${GITHUB_OUTPUT}"
          if npx --yes "wrangler@${WRANGLER_VERSION}" r2 object get "${object}" --file "${backup}" --remote >/dev/null 2>&1; then
            test -s "${backup}"
            echo "previous=true" >> "${GITHUB_OUTPUT}"
          fi
          npx --yes "wrangler@${WRANGLER_VERSION}" r2 object put \
            "${object}" \
            --file cloudflare/quant-dashboard/ai_screening_seed.json \
            --remote --content-type application/json
          echo "uploaded=true" >> "${GITHUB_OUTPUT}"

      - name: Verify the published AI API
        if: steps.revision.outputs.current == 'true' && steps.preflight.outputs.stale != 'true'
        shell: bash
        run: |
          set -euo pipefail
          generation="${{ steps.preflight.outputs.generation }}"
          endpoint="https://quant.custard.top/api/ai-screening?generation_id=${generation}"
          expected_etag="$(sha256sum cloudflare/quant-dashboard/ai_screening_seed.json | awk '{print $1}')"
          for attempt in 1 2 3 4 5 6; do
            headers="${RUNNER_TEMP}/ai-screening-headers"
            response_file="${RUNNER_TEMP}/ai-screening-response.json"
            if curl --fail --silent --show-error --dump-header "${headers}" --output "${response_file}" "${endpoint}" 2>/dev/null \
              && actual_etag="$(awk 'tolower($1) == "etag:" {print $2}' "${headers}" | tr -d '\"\r' | tail -1)" \
              && [[ "${actual_etag}" == "${expected_etag}" ]]; then
              verify_mode="$(jq -er '.review_mode' "${response_file}" 2>/dev/null || echo "codex_luna_web_review")"
              if [[ "${verify_mode}" == "local_codex_review" ]]; then
                if jq -e --arg generation "${generation}" '
                  .snapshot_generation == $generation
                  and .review_mode == "local_codex_review"
                  and .full_coverage_final_recommendation == true
                  and .reviewed_count == .candidate_total
                  and .type_pair_reviewed_count == .type_pair_candidate_total
                  and .type_pair_unreviewed_count == 0
                  and (.recommend_buy_count + .do_not_recommend_buy_count == .candidate_total)
                ' "${response_file}" >/dev/null; then
                  echo "Published AI API verified on attempt ${attempt} (local_codex_review)."
                  exit 0
                fi
              fi
              if jq -e --arg generation "${generation}" '
                .snapshot_generation == $generation
                and .review_mode == "codex_luna_web_review"
              and .full_coverage_final_recommendation == true
              and .reviewed_count == .candidate_total
              and .type_pair_reviewed_count == .type_pair_candidate_total
              and .type_pair_unreviewed_count == 0
              and (.recommend_buy_count + .do_not_recommend_buy_count == .candidate_total)
              and .web_search_attempted_count == .candidate_total
              and .web_search_event_verified_count == .candidate_total
              and .web_search_claim_urls_verified_count == .candidate_total
              and .reviewed_without_web_search == 0
              and .full_coverage_web_search == true
              and .type_pair_web_search_attempted_count == .type_pair_candidate_total
              and .type_pair_web_search_event_verified_count == .type_pair_candidate_total
              and .type_pair_web_search_claim_urls_verified_count == .type_pair_candidate_total
              and .research_source_urls_verified_count == .candidate_total
              and .type_pair_research_source_urls_verified_count == .type_pair_candidate_total
              and .source_audit.available == true
              and .source_audit.audit_contract_version == 4
              and .source_audit.audit_passed == true
              and (.source_audit.audit_sha256 | test("^[0-9a-f]{64}$"))
              and (.source_audit.merged_sha256 | test("^[0-9a-f]{64}$"))
              and (.source_audit.projection_sha256 | test("^[0-9a-f]{64}$"))
              and .source_audit.projection_company_count == .candidate_total
              and .source_audit.failed == 0
              and .source_audit.blocked == 0
              and .source_audit.invalid_claim_url_count == 0
              and .source_audit.semantic_failed_count == 0
              and .source_audit.semantic_unverified_count == 0
              and .source_audit.semantic_passed_count == .source_audit.semantic_claim_count
              and .source_audit.company_pass_count == .candidate_total
              and .source_audit.company_failed_count == 0
              and .source_audit.company_unverified_count == 0
              and .source_audit.affected_company_count == 0
              and .source_audit.network_warnings_allowed == false
              and .source_audit.release_status == "passed"
              and (.source_audit.company_coverage | length) == .candidate_total
              and all(.source_audit.company_coverage[];
                .status == "pass"
                and .semantic_failed_count == 0
                and .semantic_unverified_count == 0
                and .semantic_passed_count == .semantic_claim_count)
              and all(.packets[];
                .ai_review.source_verification_status == "pass"
                and .ai_review.source_verification_issue_count == 0
                and .ai_review.source_verification_issues == []
                and .ai_review.source_verification_issue_kinds == {})
            ' "${response_file}" >/dev/null; then
                echo "Published AI API verified on attempt ${attempt}."
                exit 0
              fi
            fi
            if [[ "${attempt}" -lt 6 ]]; then
              sleep $((attempt * 5))
            fi
          done
          echo "Published AI API did not become generation-bound and contract-valid after six attempts." >&2
          exit 1

      - name: Restore the previous AI object after a failed publication
        if: failure() && steps.revision.outputs.current == 'true' && steps.preflight.outputs.stale != 'true' && steps.overlay.outputs.uploaded == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          object="quant-market-data/ai-screening/${{ steps.preflight.outputs.generation }}.json"
          if [[ "${{ steps.overlay.outputs.previous }}" == "true" ]]; then
            npx --yes "wrangler@${WRANGLER_VERSION}" r2 object put "${object}" \
              --file "${RUNNER_TEMP}/previous-ai-screening.json" --remote --content-type application/json
            echo "Restored the previously published AI object."
          else
            npx --yes "wrangler@${WRANGLER_VERSION}" r2 object delete "${object}" --remote
            echo "Removed the failed first publication."
          fi
