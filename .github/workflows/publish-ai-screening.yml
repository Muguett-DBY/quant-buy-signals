name: publish ai screening

# The AI overlay is a generation-bound R2 object consumed by the already
# deployed Pages worker.  It has its own short website-only gate and must not
# wait for the repository's full data/software test matrix.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - cloudflare/quant-dashboard/ai_screening_seed.json
      - cloudflare/quant-dashboard/pages_worker.js
      - tools/ai_screening_contract.py
      - tools/validate_ai_screening_public.py
      - tools/calibrate_ai_screening_ranking.py
      - tests/test_ai_screening_contract.py
      - tests/test_validate_ai_screening_public.py
      - tests/test_ai_screening_release_contract.py
      - tests/test_calibrate_ai_screening_ranking.py
      - tests/test_assemble_ai_screening_reviews.py
      - tests/test_merge_ai_screening_reviews.py
      - .github/workflows/publish-ai-screening.yml

permissions:
  contents: read

concurrency:
  group: publish-ai-screening-main
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_VERSION: 4.118.0
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install the AI website gate dependencies
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Run the AI-only contract gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest==9.1.1 pyyaml==6.0.3
          node --check cloudflare/quant-dashboard/pages_worker.js
          python -m pytest \
            tests/test_ai_screening_contract.py \
            tests/test_validate_ai_screening_public.py \
            tests/test_ai_screening_release_contract.py \
            tests/test_calibrate_ai_screening_ranking.py \
            tests/test_assemble_ai_screening_reviews.py \
            tests/test_merge_ai_screening_reviews.py \
            tests/test_cloudflare_dashboard.py \
            tests/test_website_ci.py -q

      - name: Validate the seed against the live market generation
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          seed="cloudflare/quant-dashboard/ai_screening_seed.json"
          test -s "${seed}"
          generation="$(jq -er '.snapshot_generation' "${seed}")"
          market_as_of="$(jq -er '.market_as_of' "${seed}")"
          [[ "${generation}" =~ ^[0-9a-f]{16}$ ]]
          [[ "${market_as_of}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          live_meta="$(curl --fail --silent --show-error https://quant.custard.top/api/meta)"
          live_generation="$(jq -er '.generation_id' <<< "${live_meta}")"
          live_market_as_of="$(jq -er '.market_as_of' <<< "${live_meta}")"
          if [[ "${live_generation}" != "${generation}" || "${live_market_as_of}" != "${market_as_of}" ]]; then
            echo "AI seed ${generation}/${market_as_of} does not match the live market generation ${live_generation}/${live_market_as_of}." >&2
            exit 1
          fi
          python -m tools.validate_ai_screening_public \
            --artifact "${seed}" \
            --expected-generation "${generation}" \
            --expected-market-as-of "${market_as_of}"
          jq -e '
            .review_mode == "local_codex_review"
            and .full_coverage_final_recommendation == true
            and .candidate_offset == 0
            and .reviewed_count == .candidate_total
            and .type_pair_reviewed_count == .type_pair_candidate_total
            and .type_pair_unreviewed_count == 0
            and .insufficient_evidence_count == 0
            and (.recommend_buy_count + .do_not_recommend_buy_count == .candidate_total)
          ' "${seed}" >/dev/null
          echo "generation=${generation}" >> "${GITHUB_OUTPUT}"

      - name: Upload the AI overlay to its generation-bound R2 object
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          npx --yes "wrangler@${WRANGLER_VERSION}" r2 object put \
            "quant-market-data/ai-screening/${{ steps.preflight.outputs.generation }}.json" \
            --file cloudflare/quant-dashboard/ai_screening_seed.json \
            --remote --content-type application/json

      - name: Verify the published AI API
        shell: bash
        run: |
          set -euo pipefail
          generation="${{ steps.preflight.outputs.generation }}"
          response="$(curl --fail --silent --show-error "https://quant.custard.top/api/ai-screening?generation_id=${generation}")"
          jq -e --arg generation "${generation}" '
            .snapshot_generation == $generation
            and .review_mode == "local_codex_review"
            and .full_coverage_final_recommendation == true
            and .reviewed_count == .candidate_total
            and .type_pair_reviewed_count == .type_pair_candidate_total
            and .type_pair_unreviewed_count == 0
            and (.recommend_buy_count + .do_not_recommend_buy_count == .candidate_total)
          ' <<< "${response}" >/dev/null
