name: publish mobile market data

on:
  schedule:
    # One weekday post-close refresh at 16:17 Asia/Shanghai. Reliability is
    # handled inside this run so a transient publication delay cannot create
    # several independent failed runs and notification emails.
    - cron: "17 8 * * 1-5"
  workflow_dispatch:
    inputs:
      rebuild_latest_closed:
        description: Re-score the latest already closed and published market session with the current source revision
        required: false
        default: false
        type: boolean
      force_gap_refresh:
        description: Re-run the latest closed session now to fill evidence gaps (bypasses the published-session guard; used manually to reduce data gaps immediately)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mobile-market-data
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
      reason: ${{ steps.guard.outputs.reason }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Skip closed markets and an already published signed generation
        id: guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          function Get-RemoteMainRevision([string]$label) {
            $attemptLimit = 3
            $lastFailure = 'the remote returned no usable revision'
            for ($attempt = 1; $attempt -le $attemptLimit; $attempt++) {
              $remoteMain = @(git ls-remote --exit-code origin refs/heads/main 2>&1)
              $exitCode = $LASTEXITCODE
              if ($exitCode -eq 0 -and $remoteMain.Count -eq 1) {
                $line = [string]$remoteMain[0]
                if ($line -match '^(?<sha>[0-9a-f]{40})\s+refs/heads/main$') {
                  return [string]$Matches.sha
                }
                $lastFailure = 'the remote response did not contain one exact main revision'
              } else {
                $detail = (($remoteMain | ForEach-Object { [string]$_ }) -join ' ').Trim()
                if ([string]::IsNullOrWhiteSpace($detail)) {
                  $detail = 'no diagnostic output'
                }
                $lastFailure = "exit code $exitCode; $detail"
              }
              Write-Warning "$label attempt $attempt of $attemptLimit failed: $lastFailure"
              if ($attempt -lt $attemptLimit) {
                Start-Sleep -Seconds (2 * $attempt)
              }
            }
            throw "$label failed after $attemptLimit attempts: $lastFailure"
          }
          $remoteMainSha = Get-RemoteMainRevision 'Remote main revision lookup before preflight'
          if ($remoteMainSha -cne $env:GITHUB_SHA) {
            Write-Host 'This workflow run belongs to an older main revision; publication is a successful no-op.'
            'should_run=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            'reason=stale_main_workflow_run' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            return
          }
          if ('${{ inputs.rebuild_latest_closed }}' -eq 'true') {
            Write-Host 'Manual model-only rebuild will reuse the latest validated closed-market snapshot.'
            'should_run=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            'reason=manual_rebuild_latest_closed' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            return
          }
          if ('${{ inputs.force_gap_refresh }}' -eq 'true') {
            Write-Host 'Manual forced gap-refresh will re-fetch evidence for the latest closed session.'
            'should_run=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            'reason=manual_forced_gap_refresh' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            return
          }
          & .\tools\mobile_market_workflow_guard.ps1 -EventName '${{ github.event_name }}'

  build:
    if: github.ref == 'refs/heads/main' && needs.preflight.outputs.should_run == 'true'
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 240
    environment: mobile-production
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # Use the validated 3.13 lane as the single production runtime.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-bootstrap.txt
            requirements-lock.txt

      - name: Restore the last validated data baseline
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            data/cache/market_snapshot.json.gz
            data/cache/market_coldness
            data/cache/market_history
            data/cache/quality_history
            data/cache/growth_evidence
            data/cache/research_reports
            data/cache/patch4_evidence
            data/cache/cninfo_annual
          key: mobile-market-v1-${{ runner.os }}-${{ hashFiles('requirements-lock.txt', 'data/cache.py', 'data/snapshot.py', 'data/fetcher.py', 'data/datacenter.py', 'data/growth_evidence.py', 'data/quality_history.py', 'data/research_reports.py', 'data/patch4_evidence.py') }}-${{ github.run_id }}
          restore-keys: |
            mobile-market-v1-${{ runner.os }}-${{ hashFiles('requirements-lock.txt', 'data/cache.py', 'data/snapshot.py', 'data/fetcher.py', 'data/datacenter.py', 'data/growth_evidence.py', 'data/quality_history.py', 'data/research_reports.py', 'data/patch4_evidence.py') }}-
            mobile-market-v1-${{ runner.os }}-

      - name: Restore accumulated contract-validated deep evidence
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            data/cache/market_coldness
            data/cache/market_history
            data/cache/quality_history
            data/cache/growth_evidence
            data/cache/research_reports
            data/cache/patch4_evidence
            data/cache/cninfo_annual
          key: mobile-deep-evidence-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            mobile-deep-evidence-v1-${{ runner.os }}-

      - name: Pre-warm the segment evidence cache from the local backfill archive
        shell: pwsh
        run: |
          # The GitHub runner IPs are rate-limited hard by Eastmoney, so the
          # daily budgeted build captures almost no segment evidence.  A local
          # backfill on a residential IP (uploaded as a release asset) carries
          # the whole-market segment cache; pre-warm the cache directory from
          # it so the build's network budget only tops up what is missing.
          $archive = Join-Path $env:RUNNER_TEMP 'segment-cache-latest.zip'
          curl.exe -sL -o $archive "https://github.com/Muguett-DBY/quant-buy-signals/releases/download/mobile-market-data/segment-cache-latest.zip"
          if ((Test-Path -LiteralPath $archive) -and (Get-Item -LiteralPath $archive).Length -gt 1MB) {
            Expand-Archive -LiteralPath $archive -DestinationPath 'data/cache' -Force
            $count = (Get-ChildItem -LiteralPath 'data/cache/growth_evidence' -File -ErrorAction SilentlyContinue | Measure-Object).Count
            Write-Host "Pre-warmed segment cache: $count entries."
          } else {
            Write-Host 'No segment cache archive available; continuing with the runner cache.'
          }

      - name: Pre-warm the quality-history cache from the local backfill archive
        shell: pwsh
        run: |
          # The type2/type7 five-year valuation and weekly history are also
          # rate-limited hard on GitHub runner IPs.  A local backfill archive
          # (uploaded as a release asset) carries the missing companies' cache
          # generations; pre-warm the cache directory so the build reuses them.
          $archive = Join-Path $env:RUNNER_TEMP 'quality-history-cache-latest.zip'
          curl.exe -sL -o $archive "https://github.com/Muguett-DBY/quant-buy-signals/releases/download/mobile-market-data/quality-history-cache-latest.zip"
          if ((Test-Path -LiteralPath $archive) -and (Get-Item -LiteralPath $archive).Length -gt 1MB) {
            Expand-Archive -LiteralPath $archive -DestinationPath 'data/cache' -Force
            $count = (Get-ChildItem -LiteralPath 'data/cache/quality_history' -File -Filter '*.json.gz' -ErrorAction SilentlyContinue | Measure-Object).Count
            Write-Host "Pre-warmed quality-history cache: $count entries."
          } else {
            Write-Host 'No quality-history cache archive available; continuing with the runner cache.'
          }

      - name: Pre-warm the research-report cache from the local backfill archive
        shell: pwsh
        run: |
          # Type 7's category/moat evidence needs research-report bodies that
          # the rate-limited runner IP cannot fetch; a local backfill archive
          # carries them so the build reuses them.
          $archive = Join-Path $env:RUNNER_TEMP 'research-reports-cache-latest.zip'
          curl.exe -sL -o $archive "https://github.com/Muguett-DBY/quant-buy-signals/releases/download/mobile-market-data/research-reports-cache-latest.zip"
          if ((Test-Path -LiteralPath $archive) -and (Get-Item -LiteralPath $archive).Length -gt 10KB) {
            Expand-Archive -LiteralPath $archive -DestinationPath 'data/cache' -Force
            $count = (Get-ChildItem -LiteralPath 'data/cache/research_reports' -File -Filter '*.json.gz' -ErrorAction SilentlyContinue | Measure-Object).Count
            Write-Host "Pre-warmed research-report cache: $count entries."
          } else {
            Write-Host 'No research-report cache archive available; continuing with the runner cache.'
          }

      - name: Install locked production dependencies
        run: |
          python -m pip install --require-hashes -r requirements-bootstrap.txt
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m pip install pymupdf==1.28.0
          python -m pip check

      - name: Build validated market data
        shell: pwsh
        env:
          DS_DCF_DEBUG_000538: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $rebuildLatestClosed = '${{ inputs.rebuild_latest_closed }}' -eq 'true'
          if (
            $rebuildLatestClosed -and
            -not (Test-Path -LiteralPath 'data/cache/market_snapshot.json.gz' -PathType Leaf)
          ) {
            throw 'The latest closed-session model rebuild has no validated cached market snapshot; refusing a live-data fallback.'
          }
          $attemptLimit = if ($rebuildLatestClosed) { 1 } else { 2 }
          $modeLabel = if ($rebuildLatestClosed) { 'latest closed-session model rebuild' } else { 'fresh post-close refresh' }
          $releaseOutput = Join-Path $env:RUNNER_TEMP 'ds-dcf-mobile-market-data-release'
          $successfulOutput = $null
          for ($attempt = 1; $attempt -le $attemptLimit; $attempt++) {
            $output = Join-Path $env:RUNNER_TEMP "ds-dcf-mobile-market-data-attempt-$attempt"
            New-Item -ItemType Directory -Force -Path $output | Out-Null
            Write-Host "Starting $modeLabel attempt $attempt of $attemptLimit."
            $publisherArguments = @('-m', 'tools.publish_mobile_snapshot', '--output-dir', $output)
            if (-not $rebuildLatestClosed) {
              $publisherArguments += '--refresh'
            }
            & python @publisherArguments
            $refreshExitCode = $LASTEXITCODE
            if ($refreshExitCode -eq 0) {
              $manifestPath = Join-Path $output 'manifest.json'
              if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
                throw 'The successful publisher did not create manifest.json.'
              }
              $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding utf8 | ConvertFrom-Json
              $catalogueName = [string]$manifest.catalogue.filename
              $signalsName = [string]$manifest.signals.filename
              $signatureName = [string]$manifest.signature.filename
              if ($catalogueName -notmatch '^catalog-(?<generation>[0-9a-f]{16})\.json\.gz$') {
                throw "Invalid content-addressed catalogue filename: $catalogueName"
              }
              $generation = $Matches.generation
              if (
                $signalsName -cne "signals-$generation.json.gz" -or
                $signatureName -cne "manifest-$generation.sig" -or
                [string]$manifest.signature.algorithm -cne 'ECDSA_P256_SHA256'
              ) {
                throw 'The publisher did not bind catalogue, signals, and signature to one generation.'
              }
              $details = $manifest.company_details
              $detailShards = @($details.shards)
              $expectedDetailIds = @(0..15 | ForEach-Object { $_.ToString('x2') })
              if (
                [int]$details.schema_version -ne 2 -or
                [string]$details.record_schema -cne 'company_detail_v2' -or
                [string]$details.partition.algorithm -cne 'sha256_code_first_nibble' -or
                [int]$details.partition.shard_count -ne 16 -or
                [string]$details.root_algorithm -cne 'SHA256_CANONICAL_SHARD_INDEX_V1' -or
                [string]$details.root_sha256 -cnotmatch '^[0-9a-f]{64}$' -or
                $detailShards.Count -ne 16
              ) {
                throw 'The publisher did not emit the required company detail schema v2 shard contract.'
              }
              $detailNames = @()
              $rootEntries = @()
              [long]$detailCompanyCount = 0
              for ($index = 0; $index -lt 16; $index++) {
                $shard = $detailShards[$index]
                $shardId = [string]$shard.id
                $expectedId = $expectedDetailIds[$index]
                $expectedName = "company-details-$generation-$expectedId.json.gz"
                if (
                  $shardId -cne $expectedId -or
                  [string]$shard.filename -cne $expectedName -or
                  [long]$shard.company_count -lt 0 -or
                  [string]$shard.uncompressed_sha256 -cnotmatch '^[0-9a-f]{64}$' -or
                  [string]$shard.sha256 -cnotmatch '^[0-9a-f]{64}$' -or
                  [long]$shard.size -le 0 -or
                  [long]$shard.uncompressed_size -le 0
                ) {
                  throw "The publisher emitted invalid company detail shard metadata at index $index."
                }
                $detailNames += $expectedName
                $detailCompanyCount += [long]$shard.company_count
                $rootEntries += (
                  '{{"company_count":{0},"id":"{1}","uncompressed_sha256":"{2}"}}' -f
                  [long]$shard.company_count,
                  $shardId,
                  [string]$shard.uncompressed_sha256
                )
              }
              $rootJson = (
                '{"partition":{"algorithm":"sha256_code_first_nibble","shard_count":16},' +
                '"record_schema":"company_detail_v2","schema_version":2,"shards":[' +
                ($rootEntries -join ',') +
                ']}'
              )
              $rootHash = [Convert]::ToHexString(
                [Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($rootJson))
              ).ToLowerInvariant()
              if (
                $rootHash -cne [string]$details.root_sha256 -or
                $detailCompanyCount -ne [long]$details.company_count -or
                $detailCompanyCount -ne [long]$manifest.summary.company_count
              ) {
                throw 'The publisher emitted an incomplete or non-canonical company detail shard index.'
              }
              $expected = @('manifest.json', $catalogueName, $signalsName) + $detailNames | Sort-Object
              $actual = @(Get-ChildItem -LiteralPath $output -File | Select-Object -ExpandProperty Name | Sort-Object)
              if (Compare-Object $actual $expected) {
                throw "Unexpected mobile snapshot asset set: $($actual -join ', ')"
              }
              $successfulOutput = $output
              break
            }
            if ($attempt -lt $attemptLimit) {
              Write-Warning "Refresh attempt $attempt failed with exit code $refreshExitCode; retrying once without accepting stale data."
              Start-Sleep -Seconds 20
            }
          }
          if ($null -eq $successfulOutput) {
            throw "Mobile market snapshot did not pass its $modeLabel quality gates."
          }
          Move-Item -LiteralPath $successfulOutput -Destination $releaseOutput
          "MOBILE_DATA_DIR=$releaseOutput" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify the post-close, content-addressed manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path $env:MOBILE_DATA_DIR 'manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding utf8 | ConvertFrom-Json
          $catalogueName = [string]$manifest.catalogue.filename
          $signalsName = [string]$manifest.signals.filename
          $signatureName = [string]$manifest.signature.filename
          if ($catalogueName -notmatch '^catalog-(?<generation>[0-9a-f]{16})\.json\.gz$') {
            throw "Invalid content-addressed catalogue filename: $catalogueName"
          }
          $generation = $Matches.generation
          if (
            $signalsName -cne "signals-$generation.json.gz" -or
            $signatureName -cne "manifest-$generation.sig" -or
            [string]$manifest.signature.algorithm -cne 'ECDSA_P256_SHA256'
          ) {
            throw 'Catalogue, signals, and detached signature are not bound to one generation.'
          }
          $details = $manifest.company_details
          $detailShards = @($details.shards)
          $expectedDetailIds = @(0..15 | ForEach-Object { $_.ToString('x2') })
          if (
            [int]$details.schema_version -ne 2 -or
            [string]$details.record_schema -cne 'company_detail_v2' -or
            [string]$details.partition.algorithm -cne 'sha256_code_first_nibble' -or
            [int]$details.partition.shard_count -ne 16 -or
            [string]$details.root_algorithm -cne 'SHA256_CANONICAL_SHARD_INDEX_V1' -or
            [string]$details.root_sha256 -cnotmatch '^[0-9a-f]{64}$' -or
            $detailShards.Count -ne 16
          ) {
            throw 'The mobile manifest has an invalid company detail schema v2 shard contract.'
          }
          $detailNames = @()
          $rootEntries = @()
          [long]$detailCompanyCount = 0
          for ($index = 0; $index -lt 16; $index++) {
            $shard = $detailShards[$index]
            $shardId = [string]$shard.id
            $expectedId = $expectedDetailIds[$index]
            $expectedName = "company-details-$generation-$expectedId.json.gz"
            if (
              $shardId -cne $expectedId -or
              [string]$shard.filename -cne $expectedName -or
              [long]$shard.company_count -lt 0 -or
              [string]$shard.uncompressed_sha256 -cnotmatch '^[0-9a-f]{64}$' -or
              [string]$shard.sha256 -cnotmatch '^[0-9a-f]{64}$' -or
              [long]$shard.size -le 0 -or
              [long]$shard.uncompressed_size -le 0
            ) {
              throw "The mobile manifest has invalid company detail shard metadata at index $index."
            }
            $detailNames += $expectedName
            $detailCompanyCount += [long]$shard.company_count
            $rootEntries += (
              '{{"company_count":{0},"id":"{1}","uncompressed_sha256":"{2}"}}' -f
              [long]$shard.company_count,
              $shardId,
              [string]$shard.uncompressed_sha256
            )
          }
          $rootJson = (
            '{"partition":{"algorithm":"sha256_code_first_nibble","shard_count":16},' +
            '"record_schema":"company_detail_v2","schema_version":2,"shards":[' +
            ($rootEntries -join ',') +
            ']}'
          )
          $rootHash = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($rootJson))
          ).ToLowerInvariant()
          if (
            $rootHash -cne [string]$details.root_sha256 -or
            $detailCompanyCount -ne [long]$details.company_count -or
            $detailCompanyCount -ne [long]$manifest.summary.company_count
          ) {
            throw 'The company detail shard root or total company count is invalid.'
          }
          $cataloguePath = Join-Path $env:MOBILE_DATA_DIR $catalogueName
          $signalsPath = Join-Path $env:MOBILE_DATA_DIR $signalsName

          if ($manifest.analysis_quality.ok -ne $true) {
            throw 'The mobile manifest did not retain a passing analysis quality gate.'
          }
          if ([string]$manifest.provenance.source_commit -cne $env:GITHUB_SHA) {
            throw 'The mobile manifest is not bound to the checked-out main source revision.'
          }
          $shanghaiZone = [TimeZoneInfo]::FindSystemTimeZoneById('China Standard Time')
          $nowShanghai = [TimeZoneInfo]::ConvertTime([DateTimeOffset]::UtcNow, $shanghaiZone)
          $rebuildLatestClosed = '${{ inputs.rebuild_latest_closed }}' -eq 'true'
          $marketDate = [DateTime]::ParseExact(
            [string]$manifest.market_as_of,
            'yyyy-MM-dd',
            [Globalization.CultureInfo]::InvariantCulture
          )
          if (-not $rebuildLatestClosed) {
            # The post-close refresh is verified against the most recently
            # closed Shanghai trading session.  A slow build may legitimately
            # finish after midnight Shanghai time; the session date then is
            # the previous weekday, not the calendar date.
            $sessionDate = $nowShanghai.Date
            if ($nowShanghai.TimeOfDay -lt [TimeSpan]::FromHours(16)) {
              $sessionDate = $sessionDate.AddDays(-1)
            }
            while ($sessionDate.DayOfWeek -eq [DayOfWeek]::Saturday -or $sessionDate.DayOfWeek -eq [DayOfWeek]::Sunday) {
              $sessionDate = $sessionDate.AddDays(-1)
            }
            if ($marketDate.Date -ne $sessionDate) {
              throw "The mobile manifest market date $($manifest.market_as_of) is not the latest closed Shanghai session ($($sessionDate.ToString('yyyy-MM-dd')))."
            }
          }
          $dataTimestamp = [DateTimeOffset]::Parse(
            [string]$manifest.data_timestamp_utc,
            [Globalization.CultureInfo]::InvariantCulture
          )
          $dataTimestampShanghai = [TimeZoneInfo]::ConvertTime($dataTimestamp, $shanghaiZone)
          if ($rebuildLatestClosed) {
            if ($marketDate.Date -gt $nowShanghai.Date -or ($nowShanghai - $dataTimestampShanghai) -gt [TimeSpan]::FromDays(14)) {
              throw 'The model-only rebuild snapshot is future-dated or older than 14 days.'
            }
            $publishedManifestUrl = (
              "https://muguett-dby.github.io/quant-buy-signals/mobile-data/manifest.json" +
              "?model_rebuild=$env:GITHUB_RUN_ID"
            )
            $publishedManifest = Invoke-RestMethod -Uri $publishedManifestUrl -Method Get -TimeoutSec 30
            if ([string]$publishedManifest.market_as_of -cne [string]$manifest.market_as_of) {
              throw (
                "The restored snapshot session $($manifest.market_as_of) is not the latest published closed session " +
                "$($publishedManifest.market_as_of)."
              )
            }
          }
          # A fresh post-close refresh must have generated its manifest after
          # 16:15 on the market date.  A model-only rebuild may reuse a cached
          # closed snapshot or re-fetch the same closed session hours/days
          # later, so its data_timestamp is a scoring time, not the capture
          # time; the session identity is still pinned by the 14-day/future
          # checks above and by the source-quote timestamp check below.
          if (-not $rebuildLatestClosed) {
            # Generated after 16:15 on the market date.  A backfill that
            # finishes after midnight Shanghai time is still valid: its
            # data_timestamp is later on the timeline than 16:15 of the
            # market date, just not on the same calendar day.
            $marketDateReady = [DateTimeOffset]::new(
              $marketDate.Date.Add([TimeSpan]::FromMinutes(975)),
              [TimeSpan]::FromHours(8)
            )
            if ($dataTimestampShanghai -lt $marketDateReady) {
              throw 'The mobile manifest was not generated after 16:15 on its Shanghai market date.'
            }
          }

          $validation = $manifest.provenance.snapshot_validation
          $tradeDates = @($validation.trading_source_trade_dates)
          if ($tradeDates.Count -ne 1 -or [string]$tradeDates[0] -ne [string]$manifest.market_as_of) {
            throw 'Trading quotes do not prove one current Shanghai/Shenzhen market session.'
          }
          function Convert-SourceTimestamp([object]$value, [string]$label) {
            try {
              $milliseconds = [long][Math]::Round(([double]$value) * 1000.0)
              return [DateTimeOffset]::FromUnixTimeMilliseconds($milliseconds)
            } catch {
              throw "The mobile manifest has an invalid $label."
            }
          }
          $retrievedShanghai = [TimeZoneInfo]::ConvertTime(
            (Convert-SourceTimestamp $validation.retrieval_time_oldest 'oldest quote retrieval timestamp'),
            $shanghaiZone
          )
          # Same reasoning as the manifest timestamp check above: the quote
          # retrieval wall-clock time of a model-only rebuild is the rebuild
          # time, while the closed session is pinned by the source-quote
          # timestamp check that follows.
          if (-not $rebuildLatestClosed) {
            if ($retrievedShanghai -lt $marketDateReady) {
              throw 'The quote pages were not retrieved after 16:15 on the published market date.'
            }
          }
          $latestQuoteShanghai = [TimeZoneInfo]::ConvertTime(
            (Convert-SourceTimestamp $validation.source_quote_timestamp_latest 'latest source quote timestamp'),
            $shanghaiZone
          )
          if ($latestQuoteShanghai.Date -ne $marketDate.Date -or $latestQuoteShanghai.TimeOfDay -lt [TimeSpan]::FromHours(15)) {
            throw 'The source quotes do not contain a same-day closing tick at or after 15:00.'
          }

          function Get-VerifiedAsset([string]$path, [object]$metadata, [string]$label) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "The $label payload is missing."
            }
            $item = Get-Item -LiteralPath $path
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ([long]$metadata.size -ne $item.Length -or [string]$metadata.sha256 -cne $hash) {
              throw "The $label payload does not match its manifest size and SHA-256."
            }
            return $hash
          }
          $catalogueHash = Get-VerifiedAsset $cataloguePath $manifest.catalogue 'catalogue'
          $signalsHash = Get-VerifiedAsset $signalsPath $manifest.signals 'signals'
          if ($catalogueHash -ceq $signalsHash) {
            throw 'Catalogue and signals unexpectedly have identical bytes.'
          }
          function Get-UncompressedGZipBytes([string]$path, [string]$label) {
            $compressed = [IO.File]::ReadAllBytes($path)
            $inputStream = [IO.MemoryStream]::new($compressed, $false)
            $outputStream = [IO.MemoryStream]::new()
            try {
              $gzipStream = [IO.Compression.GZipStream]::new(
                $inputStream,
                [IO.Compression.CompressionMode]::Decompress
              )
              try {
                $gzipStream.CopyTo($outputStream)
              } finally {
                $gzipStream.Dispose()
              }
              return ,$outputStream.ToArray()
            } catch {
              throw "The $label payload is not a valid gzip stream: $($_.Exception.Message)"
            } finally {
              $outputStream.Dispose()
              $inputStream.Dispose()
            }
          }
          $catalogueRaw = Get-UncompressedGZipBytes $cataloguePath 'catalogue'
          $signalsRaw = Get-UncompressedGZipBytes $signalsPath 'signals'
          if (
            $catalogueRaw.Length -ne [long]$manifest.catalogue.uncompressed_size -or
            $signalsRaw.Length -ne [long]$manifest.signals.uncompressed_size
          ) {
            throw 'Catalogue or signals does not match its uncompressed manifest size.'
          }
          $generationStream = [IO.MemoryStream]::new()
          try {
            $generationStream.Write($catalogueRaw, 0, $catalogueRaw.Length)
            $generationStream.WriteByte(0)
            $generationStream.Write($signalsRaw, 0, $signalsRaw.Length)
            $generationStream.WriteByte(0)
            $generationMarker = [Text.Encoding]::ASCII.GetBytes('company-details-v2')
            $generationStream.Write($generationMarker, 0, $generationMarker.Length)
            $generationStream.WriteByte(0)
            $detailRootBytes = [Convert]::FromHexString([string]$details.root_sha256)
            $generationStream.Write($detailRootBytes, 0, $detailRootBytes.Length)
            $computedGeneration = [Convert]::ToHexString(
              [Security.Cryptography.SHA256]::HashData($generationStream.ToArray())
            ).ToLowerInvariant().Substring(0, 16)
          } finally {
            $generationStream.Dispose()
          }
          if ($computedGeneration -cne $generation) {
            throw 'The immutable filenames do not match the catalogue, signals, and company detail root generation.'
          }
          $detailCompanyCodes = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          for ($index = 0; $index -lt $detailShards.Count; $index++) {
            $shard = $detailShards[$index]
            $shardId = [string]$shard.id
            $shardPath = Join-Path $env:MOBILE_DATA_DIR ([string]$shard.filename)
            [void](Get-VerifiedAsset $shardPath $shard "company detail shard $shardId")
            $uncompressed = Get-UncompressedGZipBytes $shardPath "company detail shard $shardId"
            $uncompressedHash = [Convert]::ToHexString(
              [Security.Cryptography.SHA256]::HashData($uncompressed)
            ).ToLowerInvariant()
            if (
              $uncompressed.Length -ne [long]$shard.uncompressed_size -or
              $uncompressedHash -cne [string]$shard.uncompressed_sha256
            ) {
              throw "Company detail shard $shardId does not match its uncompressed manifest contract."
            }
            $payload = [Text.Encoding]::UTF8.GetString($uncompressed) | ConvertFrom-Json
            $companies = @($payload.companies)
            if (
              [int]$payload.schema_version -ne 2 -or
              [string]$payload.record_schema -cne 'company_detail_v2' -or
              [string]$payload.product -cne 'DS_DCF' -or
              [string]$payload.market_as_of -cne [string]$manifest.market_as_of -or
              [string]$payload.data_timestamp_utc -cne [string]$manifest.data_timestamp_utc -or
              [string]$payload.shard_id -cne $shardId -or
              [long]$payload.company_count -ne [long]$shard.company_count -or
              $companies.Count -ne [long]$shard.company_count
            ) {
              throw "Company detail shard $shardId has invalid payload identity or company coverage."
            }
            foreach ($company in $companies) {
              $companyCode = [string]$company.code
              if (
                [int]$company.schema_version -ne 2 -or
                $companyCode -cnotmatch '^[0-9]{6}$' -or
                -not $detailCompanyCodes.Add($companyCode)
              ) {
                throw "Company detail shard $shardId contains an invalid or duplicate company record."
              }
              $codeHash = [Security.Cryptography.SHA256]::HashData(
                [Text.Encoding]::ASCII.GetBytes($companyCode)
              )
              $expectedShardId = ([int]($codeHash[0] -shr 4)).ToString('x2')
              if ($expectedShardId -cne $shardId) {
                throw "Company $companyCode is stored in the wrong detail shard $shardId."
              }
            }
          }
          if ($detailCompanyCodes.Count -ne [long]$details.company_count) {
            throw 'Company detail shards do not contain one unique record for every catalogue company.'
          }
          "MOBILE_CATALOG_NAME=$catalogueName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MOBILE_SIGNALS_NAME=$signalsName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MOBILE_SIGNATURE_NAME=$signatureName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MOBILE_DETAIL_NAMES=$($detailNames -join '|')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign the exact market manifest and verify the app-pinned key
        shell: pwsh
        env:
          MOBILE_DATA_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.MOBILE_DATA_SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Join-Path $env:MOBILE_DATA_DIR 'manifest.json'
          $signature = Join-Path $env:MOBILE_DATA_DIR $env:MOBILE_SIGNATURE_NAME
          & .\tools\sign_mobile_manifest.ps1 -Manifest $manifest -Output $signature
          if (-not (Test-Path -LiteralPath $signature -PathType Leaf)) {
            throw 'Could not sign the mobile market manifest.'
          }
          $signatureSize = (Get-Item -LiteralPath $signature).Length
          if ($signatureSize -lt 64 -or $signatureSize -gt 128) {
            throw "Unexpected ECDSA signature size: $signatureSize"
          }

          $androidSource = Get-Content -LiteralPath 'android/app/src/main/java/com/muguett/dsdcf/MarketRepository.java' -Raw
          $keyMatch = [regex]::Match(
            $androidSource,
            'MOBILE_SIGNING_PUBLIC_KEY_BASE64\s*=\s*"(?<key>[A-Za-z0-9+/=]+)"\s*;',
            [Text.RegularExpressions.RegexOptions]::Singleline
          )
          if (-not $keyMatch.Success) {
            throw 'Could not read the public market-data signing key pinned by the Android client.'
          }
          $publicKey = [Convert]::FromBase64String($keyMatch.Groups['key'].Value)
          $verifier = [Security.Cryptography.ECDsa]::Create()
          try {
            $bytesRead = 0
            $verifier.ImportSubjectPublicKeyInfo($publicKey, [ref]$bytesRead)
            if ($bytesRead -ne $publicKey.Length) {
              throw 'The Android public market-data signing key contains trailing data.'
            }
            $valid = $verifier.VerifyData(
              [IO.File]::ReadAllBytes($manifest),
              [IO.File]::ReadAllBytes($signature),
              [Security.Cryptography.HashAlgorithmName]::SHA256,
              [Security.Cryptography.DSASignatureFormat]::Rfc3279DerSequence
            )
            if (-not $valid) {
              throw 'The workflow signing secret does not match the public key pinned by the Android client.'
            }
          } finally {
            $verifier.Dispose()
          }

      - name: Verify the exact immutable release bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $detailNames = @([string]$env:MOBILE_DETAIL_NAMES -split '\|' | Where-Object { $_ })
          $expected = @(
            'manifest.json',
            $env:MOBILE_CATALOG_NAME,
            $env:MOBILE_SIGNALS_NAME,
            $env:MOBILE_SIGNATURE_NAME
          ) + $detailNames | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath $env:MOBILE_DATA_DIR -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (Compare-Object $actual $expected) {
            throw "Unexpected prepared mobile release asset set: $($actual -join ', ')"
          }
          if ($env:MOBILE_CATALOG_NAME -notmatch '^catalog-(?<generation>[0-9a-f]{16})\.json\.gz$') {
            throw 'Prepared catalogue filename is not content addressed.'
          }
          $generation = $Matches.generation
          if (
            $env:MOBILE_SIGNALS_NAME -cne "signals-$generation.json.gz" -or
            $env:MOBILE_SIGNATURE_NAME -cne "manifest-$generation.sig" -or
            $detailNames.Count -ne 16
          ) {
            throw 'Prepared mobile release filenames are not content addressed.'
          }
          for ($index = 0; $index -lt 16; $index++) {
            $expectedDetailName = "company-details-$generation-$($index.ToString('x2')).json.gz"
            if ($detailNames[$index] -cne $expectedDetailName) {
              throw "Prepared company detail filename at index $index is invalid."
            }
          }
          $manifestPath = Join-Path $env:MOBILE_DATA_DIR 'manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding utf8 | ConvertFrom-Json
          if (
            [string]$manifest.catalogue.filename -cne $env:MOBILE_CATALOG_NAME -or
            [string]$manifest.signals.filename -cne $env:MOBILE_SIGNALS_NAME -or
            [string]$manifest.signature.filename -cne $env:MOBILE_SIGNATURE_NAME -or
            [string]$manifest.signature.algorithm -cne 'ECDSA_P256_SHA256'
          ) {
            throw 'The stable manifest does not reference the prepared immutable bundle.'
          }
          foreach ($entry in @(
            @($manifest.catalogue, $env:MOBILE_CATALOG_NAME),
            @($manifest.signals, $env:MOBILE_SIGNALS_NAME)
          ) + @($manifest.company_details.shards | ForEach-Object { ,@($_, [string]$_.filename) })) {
            $path = Join-Path $env:MOBILE_DATA_DIR $entry[1]
            $item = Get-Item -LiteralPath $path
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ([long]$entry[0].size -ne $item.Length -or [string]$entry[0].sha256 -cne $hash) {
              throw "Prepared payload $($entry[1]) no longer matches the stable manifest."
            }
          }

      - name: Upload the verified bundle between jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-market-data-build-${{ github.run_id }}
          path: ${{ runner.temp }}/ds-dcf-mobile-market-data-release/*
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
          overwrite: true

      - name: Save the validated data baseline
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            data/cache/market_snapshot.json.gz
            data/cache/market_coldness
            data/cache/market_history
            data/cache/quality_history
            data/cache/growth_evidence
            data/cache/research_reports
            data/cache/patch4_evidence
            data/cache/cninfo_annual
          key: mobile-market-v1-${{ runner.os }}-${{ hashFiles('requirements-lock.txt', 'data/cache.py', 'data/snapshot.py', 'data/fetcher.py', 'data/datacenter.py', 'data/growth_evidence.py', 'data/quality_history.py', 'data/research_reports.py', 'data/patch4_evidence.py') }}-${{ github.run_id }}

      - name: Save accumulated contract-validated deep evidence
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            data/cache/market_coldness
            data/cache/market_history
            data/cache/quality_history
            data/cache/growth_evidence
            data/cache/research_reports
            data/cache/patch4_evidence
            data/cache/cninfo_annual
          key: mobile-deep-evidence-v1-${{ runner.os }}-${{ github.run_id }}

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-latest
    # The signed release now contains 19 immutable payloads. GitHub validates
    # every upload digest and may need bounded retries during CDN/API lag.
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      published: ${{ steps.release.outputs.published }}
      catalogue_name: ${{ steps.release.outputs.catalogue_name }}
      signals_name: ${{ steps.release.outputs.signals_name }}
      signature_name: ${{ steps.release.outputs.signature_name }}
      detail_names: ${{ steps.release.outputs.detail_names }}
      previous_assets: ${{ steps.release.outputs.previous_assets }}
      previous_manifest_state: ${{ steps.release.outputs.previous_manifest_state }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set the private release directory
        shell: pwsh
        run: |
          "MOBILE_DATA_DIR=$env:RUNNER_TEMP\ds-dcf-mobile-market-data-release" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download the verified release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mobile-market-data-build-${{ github.run_id }}
          path: ${{ runner.temp }}/ds-dcf-mobile-market-data-release

      - name: Reverify the transferred release bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path $env:MOBILE_DATA_DIR 'manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding utf8 | ConvertFrom-Json
          $catalogueName = [string]$manifest.catalogue.filename
          $signalsName = [string]$manifest.signals.filename
          $signatureName = [string]$manifest.signature.filename
          if ($catalogueName -notmatch '^catalog-(?<generation>[0-9a-f]{16})\.json\.gz$') {
            throw 'Transferred catalogue filename is not content addressed.'
          }
          $generation = $Matches.generation
          if (
            $signalsName -cne "signals-$generation.json.gz" -or
            $signatureName -cne "manifest-$generation.sig" -or
            [string]$manifest.signature.algorithm -cne 'ECDSA_P256_SHA256'
          ) {
            throw 'Transferred bundle does not use one signed generation.'
          }
          $details = $manifest.company_details
          $detailShards = @($details.shards)
          $expectedDetailIds = @(0..15 | ForEach-Object { $_.ToString('x2') })
          if (
            [int]$details.schema_version -ne 2 -or
            [string]$details.record_schema -cne 'company_detail_v2' -or
            [string]$details.partition.algorithm -cne 'sha256_code_first_nibble' -or
            [int]$details.partition.shard_count -ne 16 -or
            [string]$details.root_algorithm -cne 'SHA256_CANONICAL_SHARD_INDEX_V1' -or
            [string]$details.root_sha256 -cnotmatch '^[0-9a-f]{64}$' -or
            $detailShards.Count -ne 16
          ) {
            throw 'Transferred manifest has an invalid company detail schema v2 shard contract.'
          }
          $detailNames = @()
          $rootEntries = @()
          [long]$detailCompanyCount = 0
          for ($index = 0; $index -lt 16; $index++) {
            $shard = $detailShards[$index]
            $shardId = [string]$shard.id
            $expectedId = $expectedDetailIds[$index]
            $expectedName = "company-details-$generation-$expectedId.json.gz"
            if (
              $shardId -cne $expectedId -or
              [string]$shard.filename -cne $expectedName -or
              [long]$shard.company_count -lt 0 -or
              [string]$shard.uncompressed_sha256 -cnotmatch '^[0-9a-f]{64}$' -or
              [string]$shard.sha256 -cnotmatch '^[0-9a-f]{64}$' -or
              [long]$shard.size -le 0 -or
              [long]$shard.uncompressed_size -le 0
            ) {
              throw "Transferred company detail shard metadata at index $index is invalid."
            }
            $detailNames += $expectedName
            $detailCompanyCount += [long]$shard.company_count
            $rootEntries += (
              '{{"company_count":{0},"id":"{1}","uncompressed_sha256":"{2}"}}' -f
              [long]$shard.company_count,
              $shardId,
              [string]$shard.uncompressed_sha256
            )
          }
          $rootJson = (
            '{"partition":{"algorithm":"sha256_code_first_nibble","shard_count":16},' +
            '"record_schema":"company_detail_v2","schema_version":2,"shards":[' +
            ($rootEntries -join ',') +
            ']}'
          )
          $rootHash = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($rootJson))
          ).ToLowerInvariant()
          if (
            $rootHash -cne [string]$details.root_sha256 -or
            $detailCompanyCount -ne [long]$details.company_count -or
            $detailCompanyCount -ne [long]$manifest.summary.company_count
          ) {
            throw 'Transferred company detail shard root or company count is invalid.'
          }
          if ([string]$manifest.provenance.source_commit -cne $env:GITHUB_SHA) {
            throw 'Transferred manifest is not bound to this main source revision.'
          }
          $expected = @('manifest.json', $catalogueName, $signalsName, $signatureName) + $detailNames | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath $env:MOBILE_DATA_DIR -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (Compare-Object $actual $expected) {
            throw "Transferred release bundle has an unexpected file set: $($actual -join ', ')"
          }
          foreach ($entry in @(
            @($manifest.catalogue, $catalogueName),
            @($manifest.signals, $signalsName)
          ) + @($detailShards | ForEach-Object { ,@($_, [string]$_.filename) })) {
            $path = Join-Path $env:MOBILE_DATA_DIR $entry[1]
            $item = Get-Item -LiteralPath $path
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ([long]$entry[0].size -ne $item.Length -or [string]$entry[0].sha256 -cne $hash) {
              throw "Transferred payload $($entry[1]) does not match the signed manifest."
            }
          }
          $androidSource = Get-Content -LiteralPath 'android/app/src/main/java/com/muguett/dsdcf/MarketRepository.java' -Raw
          $keyMatch = [regex]::Match(
            $androidSource,
            'MOBILE_SIGNING_PUBLIC_KEY_BASE64\s*=\s*"(?<key>[A-Za-z0-9+/=]+)"\s*;',
            [Text.RegularExpressions.RegexOptions]::Singleline
          )
          if (-not $keyMatch.Success) {
            throw 'Could not read the public market-data signing key pinned by the Android client.'
          }
          $publicKey = [Convert]::FromBase64String($keyMatch.Groups['key'].Value)
          $verifier = [Security.Cryptography.ECDsa]::Create()
          try {
            $bytesRead = 0
            $verifier.ImportSubjectPublicKeyInfo($publicKey, [ref]$bytesRead)
            $signaturePath = Join-Path $env:MOBILE_DATA_DIR $signatureName
            $valid = $bytesRead -eq $publicKey.Length -and $verifier.VerifyData(
              [IO.File]::ReadAllBytes($manifestPath),
              [IO.File]::ReadAllBytes($signaturePath),
              [Security.Cryptography.HashAlgorithmName]::SHA256,
              [Security.Cryptography.DSASignatureFormat]::Rfc3279DerSequence
            )
            if (-not $valid) {
              throw 'Transferred manifest signature does not match the app-pinned key.'
            }
          } finally {
            $verifier.Dispose()
          }
          "MOBILE_CATALOG_NAME=$catalogueName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MOBILE_SIGNALS_NAME=$signalsName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MOBILE_SIGNATURE_NAME=$signatureName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MOBILE_DETAIL_NAMES=$($detailNames -join '|')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MOBILE_PUBLIC_KEY=$($keyMatch.Groups['key'].Value)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish immutable payload assets and validate the previous generation
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          function Get-RemoteMainRevision([string]$label) {
            $attemptLimit = 3
            $lastFailure = 'the remote returned no usable revision'
            for ($attempt = 1; $attempt -le $attemptLimit; $attempt++) {
              $remoteMain = @(git ls-remote --exit-code origin refs/heads/main 2>&1)
              $exitCode = $LASTEXITCODE
              if ($exitCode -eq 0 -and $remoteMain.Count -eq 1) {
                $line = [string]$remoteMain[0]
                if ($line -match '^(?<sha>[0-9a-f]{40})\s+refs/heads/main$') {
                  return [string]$Matches.sha
                }
                $lastFailure = 'the remote response did not contain one exact main revision'
              } else {
                $detail = (($remoteMain | ForEach-Object { [string]$_ }) -join ' ').Trim()
                if ([string]::IsNullOrWhiteSpace($detail)) {
                  $detail = 'no diagnostic output'
                }
                $lastFailure = "exit code $exitCode; $detail"
              }
              Write-Warning "$label attempt $attempt of $attemptLimit failed: $lastFailure"
              if ($attempt -lt $attemptLimit) {
                Start-Sleep -Seconds (2 * $attempt)
              }
            }
            throw "$label failed after $attemptLimit attempts: $lastFailure"
          }
          $remoteMainSha = Get-RemoteMainRevision 'Remote main revision lookup before publication'
          if ($remoteMainSha -cne $env:GITHUB_SHA) {
            Write-Warning 'Main advanced while this run was building; the old analysis will not be published.'
            'published=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            return
          }
          $tag = 'mobile-market-data'
          $releaseExists = $false
          $releaseCreated = $false
          $releaseQueryAttemptLimit = 3
          $lastReleaseProbeFailure = 'the release query returned no diagnostic output'
          for ($attempt = 1; $attempt -le $releaseQueryAttemptLimit; $attempt++) {
            $releaseProbe = @(gh release view $tag --repo $env:GH_REPO --json tagName 2>&1)
            $releaseProbeExitCode = $LASTEXITCODE
            if ($releaseProbeExitCode -eq 0 -and -not [string]::IsNullOrWhiteSpace([string]$releaseProbe)) {
              $releaseExists = $true
              break
            }
            $releaseProbeDetail = (($releaseProbe | ForEach-Object { [string]$_ }) -join ' ').Trim()
            if ([string]::IsNullOrWhiteSpace($releaseProbeDetail)) {
              $releaseProbeDetail = 'no diagnostic output'
            }
            $lastReleaseProbeFailure = "exit code $releaseProbeExitCode; $releaseProbeDetail"
            Write-Warning "Mobile data release lookup attempt $attempt of $releaseQueryAttemptLimit failed: $lastReleaseProbeFailure"
            if ($attempt -lt $releaseQueryAttemptLimit) {
              Start-Sleep -Seconds (2 * $attempt)
            }
          }
          if (-not $releaseExists) {
            $lastReleaseCreateFailure = $lastReleaseProbeFailure
            for ($attempt = 1; $attempt -le $releaseQueryAttemptLimit; $attempt++) {
              $createOutput = @(
                gh release create $tag --repo $env:GH_REPO --target $env:GITHUB_SHA --prerelease --title 'DS_DCF mobile market data' --notes 'Automated post-close market snapshot for the DS_DCF mobile client.' 2>&1
              )
              $createExitCode = $LASTEXITCODE
              if ($createExitCode -eq 0) {
                $releaseCreated = $true
                $releaseExists = $true
                break
              }
              $confirmation = @(gh release view $tag --repo $env:GH_REPO --json tagName 2>&1)
              $confirmationExitCode = $LASTEXITCODE
              if ($confirmationExitCode -eq 0 -and -not [string]::IsNullOrWhiteSpace([string]$confirmation)) {
                # The release may have predated this run, or the create response
                # may have been lost.  Treat it as existing for conservative
                # first-publication cleanup classification.
                $releaseExists = $true
                break
              }
              $createDetail = (($createOutput | ForEach-Object { [string]$_ }) -join ' ').Trim()
              $confirmationDetail = (($confirmation | ForEach-Object { [string]$_ }) -join ' ').Trim()
              if ([string]::IsNullOrWhiteSpace($createDetail)) {
                $createDetail = 'no diagnostic output'
              }
              if ([string]::IsNullOrWhiteSpace($confirmationDetail)) {
                $confirmationDetail = 'no diagnostic output'
              }
              $lastReleaseCreateFailure = (
                "create exit code ${createExitCode}: $createDetail; " +
                "confirmation exit code ${confirmationExitCode}: $confirmationDetail"
              )
              Write-Warning "Mobile data release creation attempt $attempt of $releaseQueryAttemptLimit failed: $lastReleaseCreateFailure"
              if ($attempt -lt $releaseQueryAttemptLimit) {
                Start-Sleep -Seconds (2 * $attempt)
              }
            }
            if (-not $releaseExists) {
              throw "Could not create or confirm the mobile data prerelease after $releaseQueryAttemptLimit attempts: $lastReleaseCreateFailure"
            }
          }

          function Test-DetachedSignature([string]$manifestPath, [string]$signaturePath) {
            try {
              $publicKey = [Convert]::FromBase64String($env:MOBILE_PUBLIC_KEY)
              $verifier = [Security.Cryptography.ECDsa]::Create()
              try {
                $bytesRead = 0
                $verifier.ImportSubjectPublicKeyInfo($publicKey, [ref]$bytesRead)
                return $bytesRead -eq $publicKey.Length -and $verifier.VerifyData(
                  [IO.File]::ReadAllBytes($manifestPath),
                  [IO.File]::ReadAllBytes($signaturePath),
                  [Security.Cryptography.HashAlgorithmName]::SHA256,
                  [Security.Cryptography.DSASignatureFormat]::Rfc3279DerSequence
                )
              } finally {
                $verifier.Dispose()
              }
            } catch {
              return $false
            }
          }

          function Get-ReleaseAssetsJson {
            $attemptLimit = 3
            $lastFailure = 'the release asset query returned no diagnostic output'
            for ($attempt = 1; $attempt -le $attemptLimit; $attempt++) {
              $output = @(gh release view $tag --repo $env:GH_REPO --json assets 2>&1)
              $exitCode = $LASTEXITCODE
              if ($exitCode -eq 0 -and -not [string]::IsNullOrWhiteSpace([string]$output)) {
                return ($output -join [Environment]::NewLine)
              }
              $detail = (($output | ForEach-Object { [string]$_ }) -join ' ').Trim()
              if ([string]::IsNullOrWhiteSpace($detail)) {
                $detail = 'no diagnostic output'
              }
              $lastFailure = "exit code $exitCode; $detail"
              Write-Warning "Mobile release asset query attempt $attempt of $attemptLimit failed: $lastFailure"
              if ($attempt -lt $attemptLimit) {
                Start-Sleep -Seconds (2 * $attempt)
              }
            }
            throw "Could not inspect the mobile data prerelease after $attemptLimit attempts: $lastFailure"
          }

          function Receive-ReleaseAsset([string]$name, [string]$directory) {
            $destination = Join-Path $directory $name
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Remove-Item -LiteralPath $destination -Force -ErrorAction SilentlyContinue
              gh release download $tag --repo $env:GH_REPO --pattern $name --dir $directory --clobber
              if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $destination -PathType Leaf)) {
                return $destination
              }
              if ($attempt -lt 3) {
                Start-Sleep -Seconds (2 * $attempt)
              }
            }
            throw "Release asset $name remained unavailable after three attempts."
          }

          function Receive-ReleaseAssets([string[]]$names, [string]$directory) {
            if ($names.Count -eq 0) {
              throw 'A complete generation download requires at least one release asset.'
            }
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              foreach ($name in $names) {
                Remove-Item -LiteralPath (Join-Path $directory $name) -Force -ErrorAction SilentlyContinue
              }
              $arguments = @('release', 'download', $tag, '--repo', $env:GH_REPO, '--dir', $directory, '--clobber')
              foreach ($name in $names) {
                $arguments += @('--pattern', $name)
              }
              & gh @arguments
              $missing = @(
                $names | Where-Object {
                  -not (Test-Path -LiteralPath (Join-Path $directory $_) -PathType Leaf)
                }
              )
              if ($LASTEXITCODE -eq 0 -and $missing.Count -eq 0) {
                return
              }
              Write-Warning (
                "Complete previous-generation download attempt $attempt failed; " +
                "$($missing.Count) exact assets remain missing."
              )
              if ($attempt -lt 3) {
                Start-Sleep -Seconds (2 * $attempt)
              }
            }
            throw 'The complete previous generation remained unavailable after three attempts.'
          }

          function Get-UncompressedGZipBytes([string]$path, [string]$label) {
            $compressed = [IO.File]::ReadAllBytes($path)
            $inputStream = [IO.MemoryStream]::new($compressed, $false)
            $outputStream = [IO.MemoryStream]::new()
            try {
              $gzipStream = [IO.Compression.GZipStream]::new(
                $inputStream,
                [IO.Compression.CompressionMode]::Decompress
              )
              try {
                $gzipStream.CopyTo($outputStream)
              } finally {
                $gzipStream.Dispose()
              }
              return ,$outputStream.ToArray()
            } catch {
              throw "The $label payload is not a valid gzip stream: $($_.Exception.Message)"
            } finally {
              $outputStream.Dispose()
              $inputStream.Dispose()
            }
          }

          function Publish-ImmutableAsset([string]$name) {
            $path = Join-Path $env:MOBILE_DATA_DIR $name
            $item = Get-Item -LiteralPath $path
            $digest = 'sha256:' + (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $releaseJson = Get-ReleaseAssetsJson
            $existing = @((ConvertFrom-Json $releaseJson).assets | Where-Object { $_.name -ceq $name })
            $incomplete = @($existing | Where-Object { [string]$_.state -ceq 'starter' -or [long]$_.size -eq 0 })
            foreach ($asset in $incomplete) {
              $assetApiUrl = [string]$asset.apiUrl
              if ($assetApiUrl -notmatch '^https://api\.github\.com/repos/(?<repository>[^/]+/[^/]+)/releases/assets/(?<assetId>[0-9]+)$') {
                throw "Incomplete release asset $name has no valid GitHub asset API URL."
              }
              if ([string]$Matches.repository -ine $env:GH_REPO) {
                throw "Incomplete release asset $name belongs to another repository."
              }
              $assetId = [string]$Matches.assetId
              Write-Warning "Removing incomplete GitHub release asset $name before retrying publication."
              gh api --method DELETE "repos/$env:GH_REPO/releases/assets/$assetId"
              if ($LASTEXITCODE -ne 0) {
                throw "Could not remove incomplete GitHub release asset $name."
              }
            }
            if ($incomplete.Count -gt 0) {
              $existing = @((ConvertFrom-Json (Get-ReleaseAssetsJson)).assets | Where-Object { $_.name -ceq $name })
            }
            if ($existing.Count -gt 1) {
              throw "The mobile data prerelease contains duplicate asset name $name."
            }
            if ($existing.Count -eq 1) {
              if ([long]$existing[0].size -eq $item.Length -and [string]$existing[0].digest -ceq $digest) {
                Write-Host "Reusing identical immutable release asset $name."
                return
              }
              if ($name -ceq $env:MOBILE_SIGNATURE_NAME) {
                $existingDirectory = Join-Path $env:RUNNER_TEMP 'existing-mobile-signature'
                New-Item -ItemType Directory -Force -Path $existingDirectory | Out-Null
                $existingPath = Receive-ReleaseAsset $name $existingDirectory
                $manifestPath = Join-Path $env:MOBILE_DATA_DIR 'manifest.json'
                if (Test-DetachedSignature $manifestPath $existingPath) {
                  Write-Host 'Reusing an existing valid ECDSA signature for this immutable manifest.'
                  # ECDSA signatures are intentionally non-deterministic.  The
                  # downstream verification compares the local bytes, so make
                  # the already-published valid signature canonical before the
                  # published-bundle artifact is uploaded below.
                  Copy-Item -LiteralPath $existingPath -Destination $path -Force
                  return
                }
              }
              throw "Immutable release asset $name already exists with different bytes."
            }
            $uploaded = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              gh release upload $tag "$path#$name" --repo $env:GH_REPO
              $uploadExitCode = $LASTEXITCODE
              $afterFailure = $null
              try {
                $afterFailure = @((ConvertFrom-Json (Get-ReleaseAssetsJson)).assets | Where-Object { $_.name -ceq $name })
              } catch {
                Write-Warning "Could not query immutable asset $name after upload attempt $attempt."
              }
              if ($null -ne $afterFailure) {
                if (
                  $afterFailure.Count -eq 1 -and
                  [long]$afterFailure[0].size -eq $item.Length -and
                  [string]$afterFailure[0].digest -ceq $digest
                ) {
                  $uploaded = $true
                  break
                }
                $incompleteAfterFailure = @(
                  $afterFailure | Where-Object { [string]$_.state -ceq 'starter' -or [long]$_.size -eq 0 }
                )
                foreach ($asset in $incompleteAfterFailure) {
                  $assetApiUrl = [string]$asset.apiUrl
                  if ($assetApiUrl -notmatch '^https://api\.github\.com/repos/(?<repository>[^/]+/[^/]+)/releases/assets/(?<assetId>[0-9]+)$') {
                    throw "Incomplete release asset $name has no valid GitHub asset API URL."
                  }
                  if ([string]$Matches.repository -ine $env:GH_REPO) {
                    throw "Incomplete release asset $name belongs to another repository."
                  }
                  $assetId = [string]$Matches.assetId
                  Write-Warning "Removing incomplete GitHub release asset $name after upload attempt $attempt."
                  gh api --method DELETE "repos/$env:GH_REPO/releases/assets/$assetId"
                  if ($LASTEXITCODE -ne 0) {
                    throw "Could not remove incomplete GitHub release asset $name."
                  }
                }
              }
              if ($uploadExitCode -eq 0) {
                Write-Warning "GitHub accepted upload attempt $attempt for $name but the exact asset was not visible yet."
              }
              if ($attempt -lt 3) {
                Start-Sleep -Seconds (2 * $attempt)
              }
            }
            if (-not $uploaded) {
              throw "Could not upload immutable release asset $name after three attempts."
            }
            $published = @()
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                $releaseJson = Get-ReleaseAssetsJson
                $published = @((ConvertFrom-Json $releaseJson).assets | Where-Object { $_.name -ceq $name })
              } catch {
                $published = @()
              }
              if (
                $published.Count -eq 1 -and
                [long]$published[0].size -eq $item.Length -and
                [string]$published[0].digest -ceq $digest
              ) {
                return
              }
              if ($attempt -lt 5) {
                Start-Sleep -Seconds (3 * $attempt)
              }
            }
            throw "Immutable release asset $name was not published with the expected digest."
          }

          Publish-ImmutableAsset $env:MOBILE_CATALOG_NAME
          Publish-ImmutableAsset $env:MOBILE_SIGNALS_NAME
          $currentDetailNames = @([string]$env:MOBILE_DETAIL_NAMES -split '\|' | Where-Object { $_ })
          if ($currentDetailNames.Count -ne 16) {
            throw 'The current release does not contain all 16 company detail shards.'
          }
          foreach ($name in $currentDetailNames) {
            Publish-ImmutableAsset $name
          }
          Publish-ImmutableAsset $env:MOBILE_SIGNATURE_NAME

          $previousNames = @()
          $previousManifestState = 'error'
          $previousDirectory = Join-Path $env:RUNNER_TEMP 'previous-mobile-generation'
          New-Item -ItemType Directory -Force -Path $previousDirectory | Out-Null
          $previousManifest = Join-Path $previousDirectory 'manifest.json'
          $previousFetched = $false
          $allPreviousFetchesWereNotFound = $true
          $previousFetchFailure = $null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Remove-Item -LiteralPath $previousManifest -Force -ErrorAction SilentlyContinue
              $previousUrl = "https://muguett-dby.github.io/quant-buy-signals/mobile-data/manifest.json?before_run=$env:GITHUB_RUN_ID&fetch_attempt=$attempt"
              Invoke-WebRequest `
                -Uri $previousUrl `
                -OutFile $previousManifest `
                -MaximumRedirection 10 `
                -TimeoutSec 45
              $previousFetched = $true
              break
            } catch {
              $previousFetchFailure = $_
              $statusCode = $null
              try {
                if ($null -ne $previousFetchFailure.Exception.Response) {
                  $statusCode = [int]$previousFetchFailure.Exception.Response.StatusCode
                }
              } catch {
                $statusCode = $null
              }
              if ($statusCode -ne 404) {
                $allPreviousFetchesWereNotFound = $false
              }
              if ($attempt -lt 3) {
                Start-Sleep -Seconds (2 * $attempt)
              }
            }
          }
          if ($previousFetched) {
            try {
            $previous = Get-Content -LiteralPath $previousManifest -Raw -Encoding utf8 | ConvertFrom-Json
            $previousCatalogue = [string]$previous.catalogue.filename
            $previousSignals = [string]$previous.signals.filename
            $previousSignature = [string]$previous.signature.filename
            if ($previousCatalogue -notmatch '^catalog-(?<generation>[0-9a-f]{16})\.json\.gz$') {
              throw 'Previous catalogue filename is invalid.'
            }
            $previousGeneration = $Matches.generation
            if (
              $previousSignals -cne "signals-$previousGeneration.json.gz" -or
              $previousSignature -cne "manifest-$previousGeneration.sig" -or
              [string]$previous.signature.algorithm -cne 'ECDSA_P256_SHA256'
            ) {
              throw 'Previous manifest does not bind one generation.'
            }
            $previousDetails = $previous.company_details
            $previousDetailShards = @($previousDetails.shards)
            $expectedPreviousDetailIds = @(0..15 | ForEach-Object { $_.ToString('x2') })
            if (
              [int]$previousDetails.schema_version -ne 2 -or
              [string]$previousDetails.record_schema -cne 'company_detail_v2' -or
              [string]$previousDetails.partition.algorithm -cne 'sha256_code_first_nibble' -or
              [int]$previousDetails.partition.shard_count -ne 16 -or
              [string]$previousDetails.root_algorithm -cne 'SHA256_CANONICAL_SHARD_INDEX_V1' -or
              [string]$previousDetails.root_sha256 -cnotmatch '^[0-9a-f]{64}$' -or
              $previousDetailShards.Count -ne 16
            ) {
              throw 'Previous manifest has an invalid company detail schema v2 shard contract.'
            }
            $previousDetailNames = @()
            $previousRootEntries = @()
            [long]$previousDetailCompanyCount = 0
            for ($index = 0; $index -lt 16; $index++) {
              $shard = $previousDetailShards[$index]
              $shardId = [string]$shard.id
              $expectedId = $expectedPreviousDetailIds[$index]
              $expectedName = "company-details-$previousGeneration-$expectedId.json.gz"
              if (
                $shardId -cne $expectedId -or
                [string]$shard.filename -cne $expectedName -or
                [long]$shard.company_count -lt 0 -or
                [string]$shard.uncompressed_sha256 -cnotmatch '^[0-9a-f]{64}$' -or
                [string]$shard.sha256 -cnotmatch '^[0-9a-f]{64}$' -or
                [long]$shard.size -le 0 -or
                [long]$shard.uncompressed_size -le 0
              ) {
                throw "Previous company detail shard metadata at index $index is invalid."
              }
              $previousDetailNames += $expectedName
              $previousDetailCompanyCount += [long]$shard.company_count
              $previousRootEntries += (
                '{{"company_count":{0},"id":"{1}","uncompressed_sha256":"{2}"}}' -f
                [long]$shard.company_count,
                $shardId,
                [string]$shard.uncompressed_sha256
              )
            }
            $previousRootJson = (
              '{"partition":{"algorithm":"sha256_code_first_nibble","shard_count":16},' +
              '"record_schema":"company_detail_v2","schema_version":2,"shards":[' +
              ($previousRootEntries -join ',') +
              ']}'
            )
            $previousRootHash = [Convert]::ToHexString(
              [Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($previousRootJson))
            ).ToLowerInvariant()
            if (
              $previousRootHash -cne [string]$previousDetails.root_sha256 -or
              $previousDetailCompanyCount -ne [long]$previousDetails.company_count -or
              $previousDetailCompanyCount -ne [long]$previous.summary.company_count
            ) {
              throw 'Previous company detail shard root or company count is invalid.'
            }
            $previousAssetNames = @(
              $previousCatalogue,
              $previousSignals,
              $previousSignature
            ) + $previousDetailNames
            Receive-ReleaseAssets $previousAssetNames $previousDirectory
            if (-not (Test-DetachedSignature $previousManifest (Join-Path $previousDirectory $previousSignature))) {
              throw 'Previous manifest signature is invalid.'
            }
            foreach ($entry in @(
              @($previous.catalogue, $previousCatalogue),
              @($previous.signals, $previousSignals)
            ) + @($previousDetailShards | ForEach-Object { ,@($_, [string]$_.filename) })) {
              $path = Join-Path $previousDirectory $entry[1]
              $item = Get-Item -LiteralPath $path
              $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              if ([long]$entry[0].size -ne $item.Length -or [string]$entry[0].sha256 -cne $hash) {
                throw "Previous asset $($entry[1]) is incomplete."
              }
              if ($entry[0].PSObject.Properties.Name -contains 'uncompressed_sha256') {
                $uncompressed = Get-UncompressedGZipBytes $path "previous asset $($entry[1])"
                $uncompressedHash = [Convert]::ToHexString(
                  [Security.Cryptography.SHA256]::HashData($uncompressed)
                ).ToLowerInvariant()
                if (
                  $uncompressed.Length -ne [long]$entry[0].uncompressed_size -or
                  $uncompressedHash -cne [string]$entry[0].uncompressed_sha256
                ) {
                  throw "Previous asset $($entry[1]) does not match its uncompressed shard contract."
                }
              }
            }
            $previousCatalogueRaw = Get-UncompressedGZipBytes (
              Join-Path $previousDirectory $previousCatalogue
            ) 'previous catalogue'
            $previousSignalsRaw = Get-UncompressedGZipBytes (
              Join-Path $previousDirectory $previousSignals
            ) 'previous signals'
            if (
              $previousCatalogueRaw.Length -ne [long]$previous.catalogue.uncompressed_size -or
              $previousSignalsRaw.Length -ne [long]$previous.signals.uncompressed_size
            ) {
              throw 'Previous catalogue or signals has an invalid uncompressed size.'
            }
            $previousGenerationStream = [IO.MemoryStream]::new()
            try {
              $previousGenerationStream.Write($previousCatalogueRaw, 0, $previousCatalogueRaw.Length)
              $previousGenerationStream.WriteByte(0)
              $previousGenerationStream.Write($previousSignalsRaw, 0, $previousSignalsRaw.Length)
              $previousGenerationStream.WriteByte(0)
              $previousGenerationMarker = [Text.Encoding]::ASCII.GetBytes('company-details-v2')
              $previousGenerationStream.Write($previousGenerationMarker, 0, $previousGenerationMarker.Length)
              $previousGenerationStream.WriteByte(0)
              $previousDetailRootBytes = [Convert]::FromHexString([string]$previousDetails.root_sha256)
              $previousGenerationStream.Write(
                $previousDetailRootBytes,
                0,
                $previousDetailRootBytes.Length
              )
              $computedPreviousGeneration = [Convert]::ToHexString(
                [Security.Cryptography.SHA256]::HashData($previousGenerationStream.ToArray())
              ).ToLowerInvariant().Substring(0, 16)
            } finally {
              $previousGenerationStream.Dispose()
            }
            if ($computedPreviousGeneration -cne $previousGeneration) {
              throw 'Previous immutable filenames do not match their complete generation content.'
            }
            $previousNames = $previousAssetNames
            $previousManifestState = 'found'
            } catch {
              $previousManifestState = 'error'
              Write-Warning "Previous generation could not be validated; retention cleanup will be skipped: $($_.Exception.Message)"
            }
          } elseif ($allPreviousFetchesWereNotFound -and $releaseCreated) {
            $previousManifestState = 'missing'
            Write-Host 'No release or stable manifest existed before this run; this is a verified first publication.'
          } else {
            $previousManifestState = 'error'
            Write-Warning "Previous stable manifest could not be fetched safely; retention cleanup will be skipped: $($previousFetchFailure.Exception.Message)"
          }

          "catalogue_name=$env:MOBILE_CATALOG_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "signals_name=$env:MOBILE_SIGNALS_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "signature_name=$env:MOBILE_SIGNATURE_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "detail_names=$env:MOBILE_DETAIL_NAMES" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "previous_assets=$($previousNames -join '|')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "previous_manifest_state=$previousManifestState" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          'published=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload the canonical published bundle for downstream jobs
        if: steps.release.outputs.published == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-market-data-published-${{ github.run_id }}
          path: ${{ runner.temp }}/ds-dcf-mobile-market-data-release/*
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
          overwrite: true

  prepare_pages:
    if: github.ref == 'refs/heads/main' && needs.publish.outputs.published == 'true'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
    steps:
      - name: Download the signed manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mobile-market-data-published-${{ github.run_id }}
          path: ${{ runner.temp }}/ds-dcf-mobile-market-data-release

      - name: Prepare the atomic Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/mobile-pages/mobile-data"
          cp "${RUNNER_TEMP}/ds-dcf-mobile-market-data-release/"* "${RUNNER_TEMP}/mobile-pages/mobile-data/"
          cat > "${RUNNER_TEMP}/mobile-pages/index.html" <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="referrer" content="no-referrer">
            <title>DS_DCF 移动数据服务</title>
            <style>
              body { max-width: 42rem; margin: 4rem auto; padding: 0 1.25rem; font: 16px/1.7 system-ui, sans-serif; color: #172033; }
              main { border: 1px solid #d8dfeb; border-radius: 14px; padding: 1.5rem; background: #f8fafc; }
              a { color: #155eef; }
            </style>
          </head>
          <body>
            <main>
              <h1>DS_DCF 移动数据服务</h1>
              <p>这里发布沪深收盘后通过完整质量检查并签名的只读数据。Android 客户端不会在手机上计算估值或生成买入结论。</p>
              <p><a href="mobile-data/manifest.json">查看当前签名数据清单</a></p>
              <p><a href="https://github.com/Muguett-DBY/quant-buy-signals/releases">查看官方安装包与历史版本</a></p>
            </main>
          </body>
          </html>
          HTML
          test -s "${RUNNER_TEMP}/mobile-pages/index.html"
          manifest="${RUNNER_TEMP}/mobile-pages/mobile-data/manifest.json"
          test -s "${manifest}"
          python - "${manifest}" "${RUNNER_TEMP}/mobile-pages/mobile-data" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          manifest_path = Path(sys.argv[1])
          data_dir = Path(sys.argv[2])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          match = re.fullmatch(r"catalog-([0-9a-f]{16})\.json\.gz", manifest["catalogue"]["filename"])
          if match is None:
              raise SystemExit("Pages manifest catalogue generation is invalid")
          generation = match.group(1)
          details = manifest.get("company_details")
          expected_ids = [f"{index:02x}" for index in range(16)]
          if (
              not isinstance(details, dict)
              or details.get("schema_version") != 2
              or details.get("record_schema") != "company_detail_v2"
              or details.get("partition") != {
                  "algorithm": "sha256_code_first_nibble",
                  "shard_count": 16,
              }
              or details.get("root_algorithm") != "SHA256_CANONICAL_SHARD_INDEX_V1"
              or re.fullmatch(r"[0-9a-f]{64}", str(details.get("root_sha256") or "")) is None
              or [shard.get("id") for shard in details.get("shards", [])] != expected_ids
          ):
              raise SystemExit("Pages manifest company detail contract is invalid")
          for shard_id, shard in zip(expected_ids, details["shards"], strict=True):
              expected_name = f"company-details-{generation}-{shard_id}.json.gz"
              if shard.get("filename") != expected_name or not (data_dir / expected_name).is_file():
                  raise SystemExit(f"Pages company detail shard {shard_id} is missing or misnamed")
          PY
          test "$(find "${RUNNER_TEMP}/mobile-pages/mobile-data" -maxdepth 1 -type f | wc -l)" -eq 20

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload the complete Pages deployment
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/mobile-pages

  deploy_pages:
    if: github.ref == 'refs/heads/main'
    needs: prepare_pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Atomically switch the stable mobile manifest
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  mirror_cloudflare:
    if: github.ref == 'refs/heads/main' && needs.publish.outputs.published == 'true'
    needs:
      - publish
      - deploy_pages
    runs-on: ubuntu-latest
    # A full immutable generation can take several minutes to upload.  The
    # refresh and public-projection retries are deliberately separate below;
    # this cap covers their combined worst-case transport budget.
    timeout-minutes: 60
    permissions: {}
    env:
      REFRESH_URL: https://quant-market-refresh.1203135430.workers.dev/refresh
      REFRESH_KEY: ${{ secrets.CLOUDFLARE_MARKET_REFRESH_KEY }}
    steps:
      - name: Download the exact published generation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mobile-market-data-published-${{ github.run_id }}
          path: ${{ runner.temp }}/ds-dcf-mobile-market-data-release

      - name: Mirror and verify the public Cloudflare dashboard
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${REFRESH_KEY}" ]]; then
            echo "CLOUDFLARE_MARKET_REFRESH_KEY is required for the protected dashboard mirror." >&2
            exit 1
          fi
          manifest="${RUNNER_TEMP}/ds-dcf-mobile-market-data-release/manifest.json"
          test -s "${manifest}"
          expected_generation="$(jq -er '.catalogue.filename | capture("^catalog-(?<generation>[0-9a-f]{16})\\.json\\.gz$").generation' "${manifest}")"
          expected_market_as_of="$(jq -er '.market_as_of' "${manifest}")"
          expected_company_count="$(jq -er '.summary.company_count' "${manifest}")"
          expected_source_commit="$(jq -er '.provenance.source_commit' "${manifest}")"
          expected_manifest_sha256="$(sha256sum "${manifest}" | cut -d' ' -f1)"
          if [[ "${expected_source_commit}" != "${GITHUB_SHA}" ]]; then
            echo "Published generation is not bound to this workflow revision." >&2
            exit 1
          fi
          mirror_ok=false
          mirror_attempt_limit=8
          mirror_retry_base_delay_seconds=10
          for ((attempt=1; attempt<=mirror_attempt_limit; attempt++)); do
            response_file="$(mktemp)"
            transport_ok=false
            response_generation=""
            if status="$(curl --silent --show-error --location --retry 3 --retry-all-errors \
                --connect-timeout 20 --max-time 180 --output "${response_file}" \
                --write-out '%{http_code}' --request POST \
                --header "x-refresh-key: ${REFRESH_KEY}" "${REFRESH_URL}")"; then
              transport_ok=true
            else
              status="transport_error"
            fi
            if [[ "${transport_ok}" == "true" && "${status}" == "200" ]]; then
              response_generation="$(jq -er '(.current_generation_id // .generation_id) | select(type == "string")' "${response_file}" 2>/dev/null || true)"
            fi
            cat "${response_file}"
            printf '\n'
            rm -f "${response_file}"
            if [[ "${transport_ok}" == "true" && "${status}" == "200" && "${response_generation}" == "${expected_generation}" ]]; then
              mirror_ok=true
              break
            fi
            echo "Cloudflare dashboard mirror returned HTTP ${status} and generation '${response_generation:-none}' on attempt ${attempt} of ${mirror_attempt_limit}; expected ${expected_generation}." >&2
            if [[ "${attempt}" -lt "${mirror_attempt_limit}" ]]; then
              # GitHub Pages and release assets can become visible at different
              # times. Re-running the protected refresh retries the whole signed
              # generation instead of merely polling an unchanged projection.
              sleep $((mirror_retry_base_delay_seconds * attempt))
            fi
          done
          if [[ "${mirror_ok}" != "true" ]]; then
            echo "Cloudflare dashboard could not accept the published generation." >&2
            exit 1
          fi

          verify_cloudflare_projection() {
            local attempt="$1"
            local metadata actual health catalogue_index moutai homepage
            metadata="$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
                  --connect-timeout 20 --max-time 45 https://quant.custard.top/api/meta)" && \
              actual="$(jq -er '[.generation_id, .market_as_of, .manifest_sha256, .company_count, .source_commit] | @tsv' <<<"${metadata}")" || return 1
            local actual_generation actual_market_as_of actual_manifest_sha256 actual_company_count actual_source_commit
            IFS=$'\t' read -r actual_generation actual_market_as_of actual_manifest_sha256 actual_company_count actual_source_commit <<<"${actual}"
            [[ "${actual_generation}" == "${expected_generation}" && \
               "${actual_market_as_of}" == "${expected_market_as_of}" && \
               "${actual_manifest_sha256}" == "${expected_manifest_sha256}" && \
               "${actual_company_count}" == "${expected_company_count}" && \
               "${actual_source_commit}" == "${expected_source_commit}" ]] || return 1
            health="$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 60 \
              "https://quant.custard.top/api/health?generation_id=${expected_generation}&attempt=${attempt}")" || return 1
            jq -e --arg generation "${expected_generation}" \
              '.ok == true and .generation_id == $generation' <<<"${health}" >/dev/null || return 1
            catalogue_index="$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 60 \
              "https://quant.custard.top/api/catalogue-index?generation_id=${expected_generation}&index_contract=2")" || return 1
            jq -e --arg generation "${expected_generation}" --argjson company_count "${expected_company_count}" \
              '.generation_id == $generation and .summary.company_count == $company_count and .capabilities.type7_method_detail == true' \
              <<<"${catalogue_index}" >/dev/null || return 1
            moutai="$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 60 \
              "https://quant.custard.top/api/company/600519?generation_id=${expected_generation}")" || return 1
            jq -e --arg generation "${expected_generation}" \
              '.generation_id == $generation and .detail_contract == "company_detail_v2" and .capabilities.type7_method_detail == true and .company.code == "600519" and (.company.types.type7.method_detail.status == "current" or .company.types.type7.method_detail.status == "not_applicable")' \
              <<<"${moutai}" >/dev/null || return 1
            homepage="$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 60 "https://quant.custard.top/?generation_id=${expected_generation}")" || return 1
            grep -Fq 'patch6-seven-types-2026-08-01-classified-type7-v4' <<<"${homepage}"
          }

          for attempt in {1..6}; do
            if verify_cloudflare_projection "${attempt}"; then
              echo "Cloudflare dashboard is serving the exact published generation."
              exit 0
            fi
            echo "Cloudflare public projection has not converged on attempt ${attempt} of 6." >&2
            if [[ "${attempt}" -lt 6 ]]; then
              sleep $((5 * attempt))
            fi
          done
          echo "Cloudflare dashboard did not retain the exact published generation." >&2
          exit 1

  verify_cleanup:
    if: github.ref == 'refs/heads/main' && needs.publish.outputs.published == 'true'
    needs:
      - publish
      - deploy_pages
      - mirror_cloudflare
    runs-on: windows-latest
    # The full immutable bundle is verified in bounded parallel-generation
    # passes. Leave explicit headroom beyond CDN and cleanup retries.
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MOBILE_CATALOG_NAME: ${{ needs.publish.outputs.catalogue_name }}
      MOBILE_SIGNALS_NAME: ${{ needs.publish.outputs.signals_name }}
      MOBILE_SIGNATURE_NAME: ${{ needs.publish.outputs.signature_name }}
      MOBILE_DETAIL_NAMES: ${{ needs.publish.outputs.detail_names }}
      MOBILE_PREVIOUS_ASSETS: ${{ needs.publish.outputs.previous_assets }}
      MOBILE_PREVIOUS_MANIFEST_STATE: ${{ needs.publish.outputs.previous_manifest_state }}
    steps:
      - name: Set the private release directory
        shell: pwsh
        run: |
          "MOBILE_DATA_DIR=$env:RUNNER_TEMP\ds-dcf-mobile-market-data-release" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download the verified release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mobile-market-data-published-${{ github.run_id }}
          path: ${{ runner.temp }}/ds-dcf-mobile-market-data-release

      - name: Verify the public Pages switch and immutable downloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Join-Path $env:MOBILE_DATA_DIR 'manifest.json'
          $expectedHash = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
          $publishedManifest = Join-Path $env:RUNNER_TEMP 'public-mobile-manifest.json'
          $verified = $false
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            try {
              $url = "https://muguett-dby.github.io/quant-buy-signals/mobile-data/manifest.json?run_id=$env:GITHUB_RUN_ID&attempt=$attempt"
              Invoke-WebRequest -Uri $url -OutFile $publishedManifest -MaximumRedirection 10 -TimeoutSec 45
              $actualHash = (Get-FileHash -LiteralPath $publishedManifest -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualHash -ceq $expectedHash) {
                $verified = $true
                break
              }
            } catch {
              Write-Warning "Stable manifest verification attempt $attempt failed."
            }
            if ($attempt -lt 6) {
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          if (-not $verified) {
            throw 'GitHub Pages did not retain the exact newly signed stable manifest.'
          }
          $detailNames = @([string]$env:MOBILE_DETAIL_NAMES -split '\|' | Where-Object { $_ })
          if ($detailNames.Count -ne 16) {
            throw 'The published output did not retain all 16 company detail shard names.'
          }
          $assetNames = @(
            $env:MOBILE_CATALOG_NAME,
            $env:MOBILE_SIGNALS_NAME,
            $env:MOBILE_SIGNATURE_NAME
          ) + $detailNames
          $pendingAssets = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          $assetFailures = @{}
          foreach ($name in $assetNames) {
            [void]$pendingAssets.Add($name)
            $assetFailures[$name] = 'public release asset remained unavailable'
          }
          # GitHub's release CDN can lag the release API for several minutes.
          # Retry the complete pending set in generation-wide passes so adding
          # shards does not multiply the maximum backoff duration.
          $assetVerificationAttempts = 8
          $assetVerificationBaseDelaySeconds = 10
          for ($attempt = 1; $attempt -le $assetVerificationAttempts; $attempt++) {
            foreach ($name in @($pendingAssets)) {
              $expected = Join-Path $env:MOBILE_DATA_DIR $name
              $downloaded = Join-Path $env:RUNNER_TEMP "public-$name"
              $expectedAssetHash = (Get-FileHash -LiteralPath $expected -Algorithm SHA256).Hash
              try {
                Remove-Item -LiteralPath $downloaded -Force -ErrorAction SilentlyContinue
                $url = "https://github.com/$env:GH_REPO/releases/download/mobile-market-data/${name}?run_id=$env:GITHUB_RUN_ID&attempt=$attempt"
                Invoke-WebRequest -Uri $url -OutFile $downloaded -MaximumRedirection 10 -TimeoutSec 45
                $downloadedAssetHash = (Get-FileHash -LiteralPath $downloaded -Algorithm SHA256).Hash
                if ($downloadedAssetHash -cne $expectedAssetHash) {
                  throw "Public immutable asset $name differs from the verified build artifact."
                }
                [void]$pendingAssets.Remove($name)
              } catch {
                $assetFailures[$name] = $_.Exception.Message
                Write-Warning "Public immutable asset $name verification attempt $attempt of $assetVerificationAttempts failed: $($assetFailures[$name])"
              }
            }
            if ($pendingAssets.Count -eq 0) {
              break
            }
            if ($attempt -lt $assetVerificationAttempts) {
              Start-Sleep -Seconds ($assetVerificationBaseDelaySeconds * $attempt)
            }
          }
          if ($pendingAssets.Count -gt 0) {
            foreach ($name in @($pendingAssets)) {
              Write-Warning "Public immutable asset $name could not be verified after $assetVerificationAttempts attempts: $($assetFailures[$name])"
            }
            'MOBILE_PUBLIC_ASSET_VERIFICATION_FAILED=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Retain only the current and previous complete generations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          if ($env:MOBILE_PUBLIC_ASSET_VERIFICATION_FAILED -eq 'true') {
            Write-Warning 'Public immutable asset verification was deferred after bounded retries; retaining all release assets for the next run.'
            exit 0
          }
          if ($env:MOBILE_PREVIOUS_MANIFEST_STATE -ceq 'error') {
            Write-Warning 'Skipping retention cleanup because the previous stable generation could not be validated.'
            exit 0
          }
          if ($env:MOBILE_PREVIOUS_MANIFEST_STATE -cnotin @('found', 'missing')) {
            throw "Invalid previous manifest state: $env:MOBILE_PREVIOUS_MANIFEST_STATE"
          }
          $tag = 'mobile-market-data'
          function Get-MobileRelease {
            $attemptLimit = 3
            $lastFailure = 'the retention asset query returned no diagnostic output'
            for ($attempt = 1; $attempt -le $attemptLimit; $attempt++) {
              $output = @(gh release view $tag --repo $env:GH_REPO --json assets 2>&1)
              $exitCode = $LASTEXITCODE
              if ($exitCode -eq 0 -and -not [string]::IsNullOrWhiteSpace([string]$output)) {
                return (($output -join [Environment]::NewLine) | ConvertFrom-Json)
              }
              $detail = (($output | ForEach-Object { [string]$_ }) -join ' ').Trim()
              if ([string]::IsNullOrWhiteSpace($detail)) {
                $detail = 'no diagnostic output'
              }
              $lastFailure = "exit code $exitCode; $detail"
              Write-Warning "Mobile retention asset query attempt $attempt of $attemptLimit failed: $lastFailure"
              if ($attempt -lt $attemptLimit) {
                Start-Sleep -Seconds (2 * $attempt)
              }
            }
            throw "Could not inspect mobile assets for retention cleanup after $attemptLimit attempts: $lastFailure"
          }
          function Remove-MobileReleaseAsset([string]$name) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              gh release delete-asset $tag $name --repo $env:GH_REPO --yes
              if ($LASTEXITCODE -eq 0) {
                return
              }
              try {
                $probe = Get-MobileRelease
                if (@($probe.assets | Where-Object { $_.name -ceq $name }).Count -eq 0) {
                  return
                }
              } catch {
                Write-Warning "Could not confirm failed deletion attempt $attempt for $name."
              }
              if ($attempt -lt 3) {
                Start-Sleep -Seconds (2 * $attempt)
              }
            }
            throw "Could not delete obsolete mobile asset $name after three attempts."
          }
          $retained = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          $detailNames = @([string]$env:MOBILE_DETAIL_NAMES -split '\|' | Where-Object { $_ })
          if ($detailNames.Count -ne 16) {
            throw 'Retention cleanup did not receive all 16 current company detail shard names.'
          }
          foreach ($name in @(
            $env:MOBILE_CATALOG_NAME,
            $env:MOBILE_SIGNALS_NAME,
            $env:MOBILE_SIGNATURE_NAME
          ) + $detailNames) {
            [void]$retained.Add($name)
          }
          foreach ($name in ([string]$env:MOBILE_PREVIOUS_ASSETS -split '\|' | Where-Object { $_ })) {
            [void]$retained.Add($name)
          }
          $release = Get-MobileRelease
          $managedPattern = '^(?:manifest\.json|catalog-[0-9a-f]{16}\.json\.gz|signals-[0-9a-f]{16}\.json\.gz|company-details-[0-9a-f]{16}-[0-9a-f]{2}\.json\.gz|manifest-[0-9a-f]{16}\.sig|catalog\.json\.gz|signals\.json\.gz)$'
          foreach ($asset in @($release.assets)) {
            $name = [string]$asset.name
            if ($name -match $managedPattern -and -not $retained.Contains($name)) {
              Remove-MobileReleaseAsset $name
            }
          }
          $remaining = @((Get-MobileRelease).assets.name)
          foreach ($required in @(
            $env:MOBILE_CATALOG_NAME,
            $env:MOBILE_SIGNALS_NAME,
            $env:MOBILE_SIGNATURE_NAME
          ) + $detailNames) {
            if ($required -cnotin $remaining) {
              throw "Retention cleanup removed required mobile asset $required."
            }
          }

  archive_manifest:
    if: github.ref == 'refs/heads/main'
    needs: verify_cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the verified main revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Select or safely initialize the data audit branch
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempt status
            local attempt_limit=3
            for (( attempt=1; attempt<=attempt_limit; attempt++ )); do
              if "$@"; then
                return 0
              else
                status=$?
              fi
              echo "Command attempt ${attempt} of ${attempt_limit} failed with exit ${status}: $*" >&2
              if [[ ${attempt} -lt ${attempt_limit} ]]; then
                sleep $((2 * attempt))
              fi
            done
            echo "Command failed after ${attempt_limit} attempts with exit ${status}: $*" >&2
            return "${status}"
          }
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "The data audit branch may be prepared only by a main-branch run." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "The checked-out revision does not match this verified workflow run." >&2
            exit 1
          fi

          remote_line=""
          lookup_status=1
          lookup_attempt_limit=3
          lookup_error="${RUNNER_TEMP}/mobile-data-ls-remote-error.txt"
          lookup_error_detail="no diagnostic output"
          for (( attempt=1; attempt<=lookup_attempt_limit; attempt++ )); do
            : > "${lookup_error}"
            set +e
            remote_line="$(git ls-remote --exit-code --heads origin refs/heads/mobile-data 2>"${lookup_error}")"
            lookup_status=$?
            set -e
            if [[ ${lookup_status} -eq 0 || ( ${lookup_status} -eq 2 && -z "${remote_line}" ) ]]; then
              break
            fi
            lookup_error_detail="$(tr '\r\n' '  ' < "${lookup_error}")"
            if [[ -z "${lookup_error_detail//[[:space:]]/}" ]]; then
              lookup_error_detail="no diagnostic output"
            fi
            echo "Remote mobile-data branch lookup attempt ${attempt} of ${lookup_attempt_limit} failed with exit ${lookup_status}: ${lookup_error_detail}" >&2
            if [[ ${attempt} -lt ${lookup_attempt_limit} ]]; then
              sleep $((2 * attempt))
            fi
          done
          if [[ ${lookup_status} -eq 0 ]]; then
            if [[ ! "${remote_line}" =~ ^[0-9a-f]{40}[[:space:]]refs/heads/mobile-data$ ]]; then
              echo "The remote data audit branch identity is ambiguous." >&2
              exit 1
            fi
            retry git fetch --no-tags --depth=1 origin refs/heads/mobile-data
            git switch --create mobile-data FETCH_HEAD
          elif [[ ${lookup_status} -eq 2 && -z "${remote_line}" ]]; then
            # The first archive begins at the exact main revision whose data
            # completed this run's publication and public verification chain.
            git switch --create mobile-data "${GITHUB_SHA}"
          else
            echo "Could not determine whether the remote data audit branch exists after ${lookup_attempt_limit} attempts (exit ${lookup_status}): ${lookup_error_detail}" >&2
            exit 1
          fi
          if [[ "$(git branch --show-current)" != "mobile-data" ]]; then
            echo "The local data audit branch was not selected safely." >&2
            exit 1
          fi

      - name: Download the verified manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mobile-market-data-published-${{ github.run_id }}
          path: ${{ runner.temp }}/ds-dcf-mobile-market-data-release

      - name: Record the signed generation without changing main
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempt status
            local attempt_limit=3
            for (( attempt=1; attempt<=attempt_limit; attempt++ )); do
              if "$@"; then
                return 0
              else
                status=$?
              fi
              echo "Command attempt ${attempt} of ${attempt_limit} failed with exit ${status}: $*" >&2
              if [[ ${attempt} -lt ${attempt_limit} ]]; then
                sleep $((2 * attempt))
              fi
            done
            echo "Command failed after ${attempt_limit} attempts with exit ${status}: $*" >&2
            return "${status}"
          }
          source_dir="${RUNNER_TEMP}/ds-dcf-mobile-market-data-release"
          manifest="${source_dir}/manifest.json"
          signature_name="$(jq -er '.signature.filename' "${manifest}")"
          if [[ ! "${signature_name}" =~ ^manifest-[0-9a-f]{16}\.sig$ ]]; then
            echo "The archived manifest signature name is invalid." >&2
            exit 1
          fi
          source_commit="$(jq -er '.provenance.source_commit' "${manifest}")"
          if [[ ! "${source_commit}" =~ ^[0-9a-f]{40}$ || "${source_commit}" != "${GITHUB_SHA}" ]]; then
            echo "The archived manifest is not bound to this main source revision." >&2
            exit 1
          fi

          mkdir -p latest
          cp "${manifest}" latest/manifest.json
          find latest -maxdepth 1 -type f -name 'manifest-*.sig' ! -name "${signature_name}" -delete
          retry gh release download mobile-market-data \
            --repo "${GH_REPO}" \
            --pattern "${signature_name}" \
            --dir latest \
            --clobber
          (
            cd latest
            sha256sum manifest.json "${signature_name}" > SHA256SUMS.txt
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- latest
          if git diff --cached --quiet; then
            echo "The signed mobile generation is already archived."
            exit 0
          fi
          market_as_of="$(jq -er '.market_as_of' latest/manifest.json)"
          git commit -m "data: publish ${market_as_of} signed generation [skip ci]"
          retry git push origin HEAD:mobile-data
