name: temp export market snapshot cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Restore the market snapshot cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: snapshot-export
          key: mobile-market-v1-Windows-e7ad6bca316dafba93675bf6004bf27b0964744fb76753da2293efdc0e289bf4-30625418109
          restore-keys: |
            mobile-market-v1-Windows-
      - name: Upload the snapshot cache as an artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: market-snapshot-cache
          path: snapshot-export
          if-no-files-found: error
