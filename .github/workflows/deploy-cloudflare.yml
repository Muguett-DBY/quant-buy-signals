name: deploy cloudflare site

# Deploys the Cloudflare website (Pages advanced-mode worker, market refresh
# mirror, and post-close build dispatcher) only for a tests-verified main
# revision.
# The market-data publication workflow is deliberately NOT triggered here:
# a website push must never re-fetch or re-score market data.
#
# This workflow runs after the "tests" workflow completes on main and
# re-verifies the exact checked-out revision before deploying. Old main
# revisions are successful no-ops, so a queued older run can never overwrite
# newer main. Every tests-verified current main revision is deployed; this
# avoids trying to reconstruct a multi-commit push from one commit payload.

on:
  workflow_run:
    workflows: ["tests"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Serialize production deployments: at most one run deploys at a time, and
  # queued older runs become no-ops once a newer main exists.
  group: cloudflare-site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.workflow_run.conclusion == 'success'
    env:
      # Pinned Wrangler; never float to an unknown latest release.
      WRANGLER_VERSION: 4.118.0
    steps:
      - name: Resolve the tests-verified main revision
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          conclusion="${{ github.event.workflow_run.conclusion }}"
          branch="${{ github.event.workflow_run.head_branch }}"
          sha="${{ github.event.workflow_run.head_sha }}"
          if [[ "${conclusion}" != "success" ]]; then
            echo "tests workflow conclusion is ${conclusion}; refusing to deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${branch}" != "main" ]]; then
            echo "tests workflow ran on branch ${branch}; only main deploys."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Refuse an outdated main revision
        id: stale
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ steps.resolve.outputs.sha }}"
          remote=""
          for attempt in 1 2 3; do
            remote="$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha' || true)"
            if [[ "${remote}" =~ ^[0-9a-f]{40}$ ]]; then
              break
            fi
            echo "Remote main lookup attempt ${attempt} failed; retrying." >&2
            sleep $((2 * attempt))
          done
          if [[ ! "${remote}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not confirm the latest remote main revision." >&2
            exit 1
          fi
          if [[ "${remote}" != "${sha}" ]]; then
            echo "This run targets ${sha:0:12}, but remote main is now ${remote:0:12}; skipping to avoid overwriting newer main."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deployment skipped
        if: steps.stale.outputs.skip == 'true'
        run: echo "Skipping deployment of an outdated main revision."

      - name: Check out the tests-verified revision
        if: steps.stale.outputs.skip != 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the checked-out revision
        if: steps.stale.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ steps.resolve.outputs.sha }}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Checked out ${actual}, expected ${expected}." >&2
            exit 1
          fi
          echo "Deploying revision ${actual:0:12}."

      - name: Install the deployment verification dependencies
        if: steps.stale.outputs.skip != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Verify both workers and the dashboard contract tests
        if: steps.stale.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-cron/worker.js
          node --check cloudflare/quant-dashboard/pages_worker.js
          node --check cloudflare/quant-dashboard/refresh_worker.js
          # Same fixed versions as requirements-dev-lock.txt (pytest 9.1.1,
          # pyyaml 6.0.3) so verification never floats either.
          python -m pip install --quiet pytest==9.1.1 pyyaml==6.0.3
          python -m pytest tests/test_cloudflare_dashboard.py tests/test_website_ci.py tests/test_ai_screening_contract.py -q

      - name: Deploy the quant-market-refresh worker
        if: steps.stale.outputs.skip != 'true'
        working-directory: cloudflare/quant-dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are required." >&2
            exit 1
          fi
          # --keep-vars preserves existing bindings and variables; worker
          # secrets (the key-protected refresh secret) are always preserved
          # by wrangler itself and never appear in this workflow.
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy --keep-vars 2>&1 | tee "$RUNNER_TEMP/refresh-deploy.log"
          grep -E "Current Version ID" "$RUNNER_TEMP/refresh-deploy.log"

      - name: Deploy the post-close website data dispatcher
        if: steps.stale.outputs.skip != 'true'
        working-directory: cloudflare-cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are required." >&2
            exit 1
          fi
          # Preserve the GITHUB_TOKEN Worker secret configured outside git.
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy --keep-vars 2>&1 | tee "$RUNNER_TEMP/dispatcher-deploy.log"
          grep -E "Current Version ID" "$RUNNER_TEMP/dispatcher-deploy.log"

      - name: Deploy the Cloudflare Pages worker
        if: steps.stale.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          pages_dir="$(mktemp -d)"
          cp cloudflare/quant-dashboard/pages_worker.js "${pages_dir}/_worker.js"
          if [[ "$(find "${pages_dir}" -type f | wc -l)" -ne 1 ]]; then
            echo "The Pages staging directory must contain exactly _worker.js." >&2
            exit 1
          fi
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy "${pages_dir}" \
            --project-name quant \
            --branch main \
            --commit-hash "${{ steps.resolve.outputs.sha }}" \
            --commit-dirty=false 2>&1 | tee "$RUNNER_TEMP/pages-deploy.log"
          grep -E "Deployment complete" "$RUNNER_TEMP/pages-deploy.log"

      - name: Upload the optional generation-bound AI screening overlay
        if: steps.stale.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          seed="cloudflare/quant-dashboard/ai_screening_seed.json"
          if [[ ! -f "${seed}" ]]; then
            echo "No AI screening seed is checked in; leaving the optional overlay unchanged."
            exit 0
          fi
          generation="$(jq -er '.snapshot_generation' "${seed}")"
          if [[ ! "${generation}" =~ ^[0-9a-f]{16}$ ]]; then
            echo "AI screening seed has an invalid generation id." >&2
            exit 1
          fi
          live_meta="$(curl --fail --silent --show-error https://quant.custard.top/api/meta)"
          live_generation="$(jq -er '.generation_id' <<< "${live_meta}")"
          if [[ "${live_generation}" != "${generation}" ]]; then
            echo "AI screening seed targets ${generation}, while the published site serves ${live_generation}; skipping stale overlay."
            exit 0
          fi
          npx --yes "wrangler@${WRANGLER_VERSION}" r2 object put "quant-market-data/ai-screening/${generation}.json" \
            --file "${seed}" --remote --content-type application/json
          printf '%s' "${generation}" > "$RUNNER_TEMP/ai-screening-generation"

      - name: Verify the deployed site
        if: steps.stale.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # pages_worker.js also carries the template placeholder constants
          # (__QUANT_METHODOLOGY_VERSION__/__QUANT_METHODOLOGY_LABEL__) used by
          # the release pipeline; -m1 pins the real constants at the top of the
          # file so the comparison never sees the placeholder text.
          expected_version="$(grep -m1 -oP 'METHODOLOGY_VERSION="\K[^"]+' cloudflare/quant-dashboard/pages_worker.js)"
          expected_label="$(grep -m1 -oP 'METHODOLOGY_LABEL="\K[^"]+' cloudflare/quant-dashboard/pages_worker.js)"
          if [[ -z "${expected_version}" || -z "${expected_label}" ]]; then
            echo "Could not extract the expected methodology version/label from the worker." >&2
            exit 1
          fi
          methodology="$(curl --fail --silent --show-error https://quant.custard.top/api/methodology)"
          actual_version="$(jq -er '.methodology_version' <<< "${methodology}")"
          if [[ "${actual_version}" != "${expected_version}" ]]; then
            echo "Deployed methodology ${actual_version} != expected ${expected_version}." >&2
            exit 1
          fi
          health="$(curl --fail --silent --show-error 'https://quant.custard.top/api/health?deep=1')"
          if ! jq -e '.ok == true and .integrity_checked == true and .integrity_ok == true and (.generation_id | length) >= 16' <<< "${health}" >/dev/null; then
            echo "Deployed /api/health did not verify the complete generation." >&2
            exit 1
          fi
          meta="$(curl --fail --silent --show-error https://quant.custard.top/api/meta)"
          if [[ "$(jq -er '.generation_id | length' <<< "${meta}")" -lt 16 ]]; then
            echo "Deployed /api/meta has no valid generation." >&2
            exit 1
          fi
          homepage="$(curl --fail --silent --show-error https://quant.custard.top/)"
          if ! grep -qF "${expected_version}" <<< "${homepage}"; then
            echo "Deployed homepage does not expose the current methodology version." >&2
            exit 1
          fi
          ai_page="$(curl --fail --silent --show-error https://quant.custard.top/ai-screening)"
          if ! grep -qF "AI" <<< "${ai_page}"; then
            echo "Deployed AI screening page is unavailable." >&2
            exit 1
          fi
          if [[ -f "$RUNNER_TEMP/ai-screening-generation" ]]; then
            ai_generation="$(< "$RUNNER_TEMP/ai-screening-generation")"
            ai_api="$(curl --fail --silent --show-error "https://quant.custard.top/api/ai-screening?generation_id=${ai_generation}")"
            if ! jq -e --arg generation "${ai_generation}" '.snapshot_generation == $generation and .ai_is_advisory == true and .auto_buy_promotion == false and .full_coverage_final_recommendation == true and .reviewed_count == .candidate_total and .insufficient_evidence_count == 0 and (.recommend_buy_count + .do_not_recommend_buy_count == .candidate_total)' <<< "${ai_api}" >/dev/null; then
              echo "Published AI screening overlay failed its generation-bound contract." >&2
              exit 1
            fi
          fi
          echo "Verified /api/methodology, /api/health, /api/meta, /ai-screening and the homepage."
