name: deploy cloudflare site

# Deploys the Cloudflare website (Pages advanced-mode worker, market refresh
# mirror, and post-close build dispatcher) only for a tests-verified main
# revision.
# The market-data publication workflow is deliberately NOT triggered here:
# a website push must never re-fetch or re-score market data.
#
# This workflow runs after the "tests" workflow completes on main and
# re-verifies the exact checked-out revision before deploying. Old main
# revisions are successful no-ops, so a queued older run can never overwrite
# newer main. Every tests-verified current main revision is deployed; this
# avoids trying to reconstruct a multi-commit push from one commit payload.

on:
  workflow_run:
    workflows: ["tests"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Serialize production deployments: at most one run deploys at a time, and
  # queued older runs become no-ops once a newer main exists.
  group: cloudflare-site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.workflow_run.conclusion == 'success'
    env:
      # Pinned Wrangler; never float to an unknown latest release.
      WRANGLER_VERSION: 4.118.0
    steps:
      - name: Resolve the tests-verified main revision
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          conclusion="${{ github.event.workflow_run.conclusion }}"
          branch="${{ github.event.workflow_run.head_branch }}"
          sha="${{ github.event.workflow_run.head_sha }}"
          if [[ "${conclusion}" != "success" ]]; then
            echo "tests workflow conclusion is ${conclusion}; refusing to deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${branch}" != "main" ]]; then
            echo "tests workflow ran on branch ${branch}; only main deploys."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Refuse an outdated main revision
        id: stale
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ steps.resolve.outputs.sha }}"
          remote=""
          for attempt in 1 2 3; do
            remote="$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha' || true)"
            if [[ "${remote}" =~ ^[0-9a-f]{40}$ ]]; then
              break
            fi
            echo "Remote main lookup attempt ${attempt} failed; retrying." >&2
            sleep $((2 * attempt))
          done
          if [[ ! "${remote}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not confirm the latest remote main revision." >&2
            exit 1
          fi
          if [[ "${remote}" != "${sha}" ]]; then
            echo "This run targets ${sha:0:12}, but remote main is now ${remote:0:12}; skipping to avoid overwriting newer main."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deployment skipped
        if: steps.stale.outputs.skip == 'true'
        run: echo "Skipping deployment of an outdated main revision."

      - name: Check out the tests-verified revision
        if: steps.stale.outputs.skip != 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the checked-out revision
        if: steps.stale.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ steps.resolve.outputs.sha }}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Checked out ${actual}, expected ${expected}." >&2
            exit 1
          fi
          echo "Deploying revision ${actual:0:12}."

      - name: Install the deployment verification dependencies
        if: steps.stale.outputs.skip != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Verify both workers and the dashboard contract tests
        if: steps.stale.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-cron/worker.js
          node --check cloudflare/quant-dashboard/pages_worker.js
          node --check cloudflare/quant-dashboard/refresh_worker.js
          # Same fixed versions as requirements-dev-lock.txt (pytest 9.1.1,
          # pyyaml 6.0.3) so verification never floats either.
          python -m pip install --quiet pytest==9.1.1 pyyaml==6.0.3
          python -m pytest tests/test_cloudflare_dashboard.py tests/test_website_ci.py tests/test_ai_screening_contract.py tests/test_validate_ai_screening_public.py -q

      - name: Preflight the optional generation-bound AI screening overlay
        id: ai_preflight
        if: steps.stale.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          seed="cloudflare/quant-dashboard/ai_screening_seed.json"
          seed_changed=false
          resolved_sha="${{ steps.resolve.outputs.sha }}"
          if git rev-parse --verify "${resolved_sha}^" >/dev/null 2>&1 && ! git diff --quiet "${resolved_sha}^" "${resolved_sha}" -- "${seed}"; then
            seed_changed=true
          fi
          echo "seed_changed=${seed_changed}" >> "${GITHUB_OUTPUT}"
          echo "upload=false" >> "${GITHUB_OUTPUT}"
          if [[ ! -f "${seed}" ]]; then
            echo "No AI screening seed is checked in; leaving the optional overlay unchanged."
            exit 0
          fi
          seed_bytes="$(stat -c '%s' "${seed}")"
          if [[ "${seed_bytes}" -lt 1 || "${seed_bytes}" -gt 33554432 ]]; then
            echo "AI screening seed size ${seed_bytes} is outside the 1..33554432 byte limit." >&2
            exit 1
          fi
          generation="$(jq -er '.snapshot_generation' "${seed}")"
          if [[ ! "${generation}" =~ ^[0-9a-f]{16}$ ]]; then
            echo "AI screening seed has an invalid generation id." >&2
            exit 1
          fi
          live_meta="$(curl --fail --silent --show-error https://quant.custard.top/api/meta)"
          live_generation="$(jq -er '.generation_id' <<< "${live_meta}")"
          stale_seed=false
          if [[ "${live_generation}" != "${generation}" ]]; then
            if [[ "${seed_changed}" == "true" ]]; then
              echo "Changed AI screening seed targets ${generation}, while the published site serves ${live_generation}." >&2
              exit 1
            fi
            stale_seed=true
            market_as_of="$(jq -er '.market_as_of' "${seed}")"
          else
            market_as_of="$(jq -er '.market_as_of' <<< "${live_meta}")"
          fi
          python -m tools.validate_ai_screening_public \
            --artifact "${seed}" \
            --expected-generation "${generation}" \
            --expected-market-as-of "${market_as_of}"
          if jq -e '.review_mode == "opencode_native_company_research_review"' "${seed}" >/dev/null; then
            python -m tools.audit_ai_company_research_reviews --artifact "${seed}"
            jq -e '
              .source_audit.available == true
              and .source_audit.audit_contract_version == 3
              and .source_audit.audit_passed == true
              and (.source_audit.audit_sha256 | test("^[0-9a-f]{64}$"))
              and (.source_audit.projection_sha256 | test("^[0-9a-f]{64}$"))
              and .source_audit.projection_company_count == .candidate_total
              and (.source_audit.projection_claim_count | type) == "number"
              and (.source_audit.projection_search_finding_count | type) == "number"
              and (.source_audit.projection_source_reference_count | type) == "number"
              and (.source_audit.projection_unique_url_count | type) == "number"
              and .source_audit.projection_claim_count == .source_audit.claim_count
              and .source_audit.projection_source_reference_count >= .source_audit.projection_unique_url_count
              and .source_audit.projection_unique_url_count == (.source_audit.canonical_urls | length)
              and .source_audit.failed == 0
              and .source_audit.invalid_claim_url_count == 0
              and .source_audit.claim_count >= .candidate_total
              and (.source_audit.semantic_claim_count | type) == "number"
              and (.source_audit.semantic_passed_count | type) == "number"
              and .source_audit.semantic_failed_count == 0
              and .source_audit.semantic_unverified_count == 0
              and (.source_audit.canonical_urls | type) == "array"
              and (.source_audit.source_bindings | type) == "array"
              and (.source_audit.company_coverage | type) == "array"
              and (.source_audit.company_coverage | length) == .candidate_total
              and all(.source_audit.company_coverage[];
                (.referenced_no_source_finding_ids | type) == "array"
                and (.referenced_no_source_finding_ids | length) == 0
                and (.semantic_claim_count == .semantic_passed_count + .semantic_failed_count + .semantic_unverified_count)
                and .semantic_failed_count == 0
                and .semantic_unverified_count == 0
              )
            ' "${seed}" >/dev/null
          fi
          if [[ "${stale_seed}" == "true" ]]; then
            echo "Unchanged stale AI screening seed passed the current Worker contract; leaving that historical overlay untouched."
            exit 0
          fi
          echo "generation=${generation}" >> "${GITHUB_OUTPUT}"
          echo "market_as_of=${market_as_of}" >> "${GITHUB_OUTPUT}"
          echo "upload=true" >> "${GITHUB_OUTPUT}"
          echo "AI screening seed passed generation, coverage, source-audit and size preflight before deployment."

      - name: Deploy the quant-market-refresh worker
        if: steps.stale.outputs.skip != 'true'
        working-directory: cloudflare/quant-dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are required." >&2
            exit 1
          fi
          # --keep-vars preserves existing bindings and variables; worker
          # secrets (the key-protected refresh secret) are always preserved
          # by wrangler itself and never appear in this workflow.
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy --keep-vars 2>&1 | tee "$RUNNER_TEMP/refresh-deploy.log"
          grep -E "Current Version ID" "$RUNNER_TEMP/refresh-deploy.log"

      - name: Deploy the post-close website data dispatcher
        if: steps.stale.outputs.skip != 'true'
        working-directory: cloudflare-cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are required." >&2
            exit 1
          fi
          # Preserve the GITHUB_TOKEN Worker secret configured outside git.
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy --keep-vars 2>&1 | tee "$RUNNER_TEMP/dispatcher-deploy.log"
          grep -E "Current Version ID" "$RUNNER_TEMP/dispatcher-deploy.log"

      - name: Upload the optional generation-bound AI screening overlay
        id: ai_overlay
        if: steps.stale.outputs.skip != 'true' && steps.ai_preflight.outputs.upload == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          seed="cloudflare/quant-dashboard/ai_screening_seed.json"
          generation="${{ steps.ai_preflight.outputs.generation }}"
          npx --yes "wrangler@${WRANGLER_VERSION}" r2 object put "quant-market-data/ai-screening/${generation}.json" \
            --file "${seed}" --remote --content-type application/json
          printf '%s' "${generation}" > "$RUNNER_TEMP/ai-screening-generation"
          echo "uploaded=true" >> "${GITHUB_OUTPUT}"

      - name: Deploy the Cloudflare Pages worker
        if: steps.stale.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          pages_dir="$(mktemp -d)"
          cp cloudflare/quant-dashboard/pages_worker.js "${pages_dir}/_worker.js"
          if [[ "$(find "${pages_dir}" -type f | wc -l)" -ne 1 ]]; then
            echo "The Pages staging directory must contain exactly _worker.js." >&2
            exit 1
          fi
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy "${pages_dir}" \
            --project-name quant \
            --branch main \
            --commit-hash "${{ steps.resolve.outputs.sha }}" \
            --commit-dirty=false 2>&1 | tee "$RUNNER_TEMP/pages-deploy.log"
          grep -E "Deployment complete" "$RUNNER_TEMP/pages-deploy.log"

      - name: Verify the deployed site
        if: steps.stale.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.ai_preflight.outputs.seed_changed }}" == "true" && "${{ steps.ai_overlay.outputs.uploaded }}" != "true" ]]; then
            echo "The changed AI screening seed was not uploaded." >&2
            exit 1
          fi
          # pages_worker.js also carries the template placeholder constants
          # (__QUANT_METHODOLOGY_VERSION__/__QUANT_METHODOLOGY_LABEL__) used by
          # the release pipeline; -m1 pins the real constants at the top of the
          # file so the comparison never sees the placeholder text.
          expected_version="$(grep -m1 -oP 'METHODOLOGY_VERSION="\K[^"]+' cloudflare/quant-dashboard/pages_worker.js)"
          expected_label="$(grep -m1 -oP 'METHODOLOGY_LABEL="\K[^"]+' cloudflare/quant-dashboard/pages_worker.js)"
          if [[ -z "${expected_version}" || -z "${expected_label}" ]]; then
            echo "Could not extract the expected methodology version/label from the worker." >&2
            exit 1
          fi
          methodology="$(curl --fail --silent --show-error https://quant.custard.top/api/methodology)"
          actual_version="$(jq -er '.methodology_version' <<< "${methodology}")"
          if [[ "${actual_version}" != "${expected_version}" ]]; then
            echo "Deployed methodology ${actual_version} != expected ${expected_version}." >&2
            exit 1
          fi
          health="$(curl --fail --silent --show-error 'https://quant.custard.top/api/health?deep=1')"
          if ! jq -e '.ok == true and .integrity_checked == true and .integrity_ok == true and (.generation_id | length) >= 16' <<< "${health}" >/dev/null; then
            echo "Deployed /api/health did not verify the complete generation." >&2
            exit 1
          fi
          meta="$(curl --fail --silent --show-error https://quant.custard.top/api/meta)"
          if [[ "$(jq -er '.generation_id | length' <<< "${meta}")" -lt 16 ]]; then
            echo "Deployed /api/meta has no valid generation." >&2
            exit 1
          fi
          homepage="$(curl --fail --silent --show-error https://quant.custard.top/)"
          if ! grep -qF "${expected_version}" <<< "${homepage}"; then
            echo "Deployed homepage does not expose the current methodology version." >&2
            exit 1
          fi
          ai_page="$(curl --fail --silent --show-error https://quant.custard.top/ai-screening)"
          if ! grep -qF "AI" <<< "${ai_page}"; then
            echo "Deployed AI screening page is unavailable." >&2
            exit 1
          fi
          if [[ -f "$RUNNER_TEMP/ai-screening-generation" ]]; then
            ai_generation="$(< "$RUNNER_TEMP/ai-screening-generation")"
            ai_api="$(curl --fail --silent --show-error "https://quant.custard.top/api/ai-screening?generation_id=${ai_generation}")"
            if ! jq -e --arg generation "${ai_generation}" '
              .snapshot_generation == $generation
              and .ai_is_advisory == true
              and .auto_buy_promotion == false
              and .full_coverage_final_recommendation == true
              and .candidate_offset == 0
              and .reviewed_count == .candidate_total
              and .type_pair_reviewed_count == .type_pair_candidate_total
              and .type_pair_candidate_total == .type_pair_expected_total
              and .type_pair_unreviewed_count == 0
              and .insufficient_evidence_count == 0
              and (.recommend_buy_count + .do_not_recommend_buy_count == .candidate_total)
              and (
                if (.review_mode == "local_codex_review" or .review_mode == "opencode_mixed_review") then
                  (.web_search_attempted_count >= 0
                   and .web_search_attempted_count <= .candidate_total
                   and .reviewed_without_web_search == (.candidate_total - .web_search_attempted_count))
                 elif .review_mode == "opencode_native_company_research_review" then
                   (.web_search_attempted_count == .candidate_total
                    and .web_search_event_verified_count == .candidate_total
                    and .research_source_urls_verified_count == .candidate_total
                    and .reviewed_without_web_search == 0
                    and .type_pair_web_search_attempted_count == .type_pair_candidate_total
                    and .type_pair_web_search_event_verified_count == .type_pair_candidate_total
                    and .type_pair_research_source_urls_verified_count == .type_pair_candidate_total
                    and .full_coverage_web_search == true
                    and .source_audit.available == true
                    and .source_audit.audit_contract_version == 3
                    and .source_audit.audit_passed == true
                    and (.source_audit.audit_sha256 | test("^[0-9a-f]{64}$"))
                    and (.source_audit.merged_sha256 | test("^[0-9a-f]{64}$"))
                    and (.source_audit.projection_sha256 | test("^[0-9a-f]{64}$"))
                    and .source_audit.projection_company_count == .candidate_total
                    and (.source_audit.projection_claim_count | type) == "number"
                    and (.source_audit.projection_search_finding_count | type) == "number"
                    and (.source_audit.projection_source_reference_count | type) == "number"
                    and (.source_audit.projection_unique_url_count | type) == "number"
                    and .source_audit.projection_claim_count == .source_audit.claim_count
                    and .source_audit.projection_source_reference_count >= .source_audit.projection_unique_url_count
                    and .source_audit.projection_unique_url_count == (.source_audit.canonical_urls | length)
                    and .source_audit.invalid_claim_url_count == 0
                    and .source_audit.failed == 0
                    and .source_audit.semantic_failed_count == 0
                    and .source_audit.semantic_unverified_count == 0
                    and .source_audit.semantic_claim_count == .source_audit.semantic_passed_count
                    and (.source_audit.canonical_urls | type) == "array"
                    and (.source_audit.source_bindings | type) == "array"
                    and (.source_audit.company_coverage | type) == "array"
                    and (.source_audit.company_coverage | length) == .candidate_total
                    and all(.source_audit.company_coverage[];
                      (.referenced_no_source_finding_ids | type) == "array"
                      and (.referenced_no_source_finding_ids | length) == 0
                      and .semantic_failed_count == 0
                      and .semantic_unverified_count == 0
                    ))
                else
                  (.web_search_attempted_count == .candidate_total
                   and .web_search_event_verified_count == .candidate_total
                   and .reviewed_without_web_search == 0
                   and .type_pair_web_search_attempted_count == .type_pair_candidate_total
                   and .type_pair_web_search_event_verified_count == .type_pair_candidate_total
                   and .type_pair_web_search_claim_urls_verified_count == .type_pair_candidate_total)
                end
              )
            ' <<< "${ai_api}" >/dev/null; then
              echo "Published AI screening overlay failed its generation-bound contract." >&2
              exit 1
            fi
          fi
          echo "Verified /api/methodology, /api/health, /api/meta, /ai-screening and the homepage."
