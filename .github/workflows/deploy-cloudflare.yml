name: deploy cloudflare site

# Deploys the Cloudflare website (Pages advanced-mode worker, market refresh
# mirror, and post-close build dispatcher) only for a tests-verified main
# revision.
# The market-data publication workflow is deliberately NOT triggered here:
# a website push must never re-fetch or re-score market data.
#
# This workflow runs after the "tests" workflow completes on main and
# re-verifies the exact checked-out revision before deploying. Old main
# revisions are successful no-ops, so a queued older run can never overwrite
# newer main. Every tests-verified current main revision is deployed; this
# avoids trying to reconstruct a multi-commit push from one commit payload.

on:
  workflow_run:
    workflows: ["tests"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Serialize production deployments: at most one run deploys at a time, and
  # queued older runs become no-ops once a newer main exists.
  group: cloudflare-site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.workflow_run.conclusion == 'success'
    env:
      # Pinned Wrangler; never float to an unknown latest release.
      WRANGLER_VERSION: 4.118.0
    steps:
      - name: Resolve the tests-verified main revision
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          conclusion="${{ github.event.workflow_run.conclusion }}"
          branch="${{ github.event.workflow_run.head_branch }}"
          sha="${{ github.event.workflow_run.head_sha }}"
          if [[ "${conclusion}" != "success" ]]; then
            echo "tests workflow conclusion is ${conclusion}; refusing to deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${branch}" != "main" ]]; then
            echo "tests workflow ran on branch ${branch}; only main deploys."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Refuse an outdated main revision
        id: stale
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ steps.resolve.outputs.sha }}"
          remote=""
          for attempt in 1 2 3; do
            remote="$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha' || true)"
            if [[ "${remote}" =~ ^[0-9a-f]{40}$ ]]; then
              break
            fi
            echo "Remote main lookup attempt ${attempt} failed; retrying." >&2
            sleep $((2 * attempt))
          done
          if [[ ! "${remote}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not confirm the latest remote main revision." >&2
            exit 1
          fi
          if [[ "${remote}" != "${sha}" ]]; then
            echo "This run targets ${sha:0:12}, but remote main is now ${remote:0:12}; skipping to avoid overwriting newer main."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deployment skipped
        if: steps.stale.outputs.skip == 'true'
        run: echo "Skipping deployment of an outdated main revision."

      - name: Check out the tests-verified revision
        if: steps.stale.outputs.skip != 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the checked-out revision
        if: steps.stale.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ steps.resolve.outputs.sha }}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Checked out ${actual}, expected ${expected}." >&2
            exit 1
          fi
          echo "Deploying revision ${actual:0:12}."

      - name: Determine whether Cloudflare runtime code changed
        id: runtime
        if: steps.stale.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          live_meta="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-all-errors --retry-delay 2 https://quant.custard.top/api/meta 2>/dev/null || true)"
          live_revision="$(jq -r '.code_commit // empty' <<< "${live_meta}" 2>/dev/null || true)"
          if [[ ! "${live_revision}" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "${live_revision}^{commit}" 2>/dev/null; then
            echo "No trustworthy deployed code revision is available; running the deployment."
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          changed="${RUNNER_TEMP}/cloudflare-runtime-changes.txt"
          git diff --no-renames --name-only "${live_revision}" "${{ steps.resolve.outputs.sha }}" -- > "${changed}"
          if grep -Eq '^(cloudflare-cron/|cloudflare/quant-dashboard/(pages_worker\.js|refresh_worker\.js|wrangler\.jsonc|market_signing_public_key\.txt|schema\.sql|migrations/))' "${changed}"; then
            echo "Cloudflare runtime changes detected since ${live_revision:0:12}."
            cat "${changed}"
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "deploy=false" >> "${GITHUB_OUTPUT}"
          echo "No Cloudflare runtime files changed since ${live_revision:0:12}; the independent data/AI publication lanes remain authoritative."

      - name: Runtime deployment skipped
        if: steps.stale.outputs.skip != 'true' && steps.runtime.outputs.deploy == 'false'
        run: echo "No Cloudflare runtime deployment is required for this verified revision."

      - name: Recheck the deployable Worker syntax
        if: steps.stale.outputs.skip != 'true' && steps.runtime.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-cron/worker.js
          node --check cloudflare/quant-dashboard/pages_worker.js
          node --check cloudflare/quant-dashboard/refresh_worker.js

      - name: Capture the active Worker versions
        id: workers_previous
        if: steps.stale.outputs.skip != 'true' && steps.runtime.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          for worker in quant-market-refresh ds-dcf-dispatch; do
            response="$(curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 30 --retry 4 --retry-all-errors --retry-delay 2 \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker}/deployments")"
            version="$(jq -er '
              select(.success == true)
              | .result.deployments[0]
              | select((.versions | length) == 1 and .versions[0].percentage == 100)
              | .versions[0].version_id
            ' <<< "${response}")"
            [[ "${version}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
            if [[ "${worker}" == "quant-market-refresh" ]]; then
              echo "refresh=${version}" >> "${GITHUB_OUTPUT}"
            else
              echo "dispatcher=${version}" >> "${GITHUB_OUTPUT}"
            fi
          done

      - name: Apply pending D1 migrations
        if: steps.stale.outputs.skip != 'true' && steps.runtime.outputs.deploy == 'true'
        working-directory: cloudflare/quant-dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 migrations apply quant-market-data --remote

      - name: Deploy the quant-market-refresh worker
        id: refresh_deploy
        if: steps.stale.outputs.skip != 'true' && steps.runtime.outputs.deploy == 'true'
        working-directory: cloudflare/quant-dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are required." >&2
            exit 1
          fi
          # --keep-vars preserves existing bindings and variables; worker
          # secrets (the key-protected refresh secret) are always preserved
          # by wrangler itself and never appear in this workflow.
          echo "attempted=true" >> "${GITHUB_OUTPUT}"
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy --keep-vars 2>&1 | tee "$RUNNER_TEMP/refresh-deploy.log"
          echo "deployed=true" >> "${GITHUB_OUTPUT}"
          grep -E "Current Version ID" "$RUNNER_TEMP/refresh-deploy.log"

      - name: Deploy the post-close website data dispatcher
        id: dispatcher_deploy
        if: steps.stale.outputs.skip != 'true' && steps.runtime.outputs.deploy == 'true'
        working-directory: cloudflare-cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are required." >&2
            exit 1
          fi
          # Preserve the GITHUB_TOKEN Worker secret configured outside git.
          echo "attempted=true" >> "${GITHUB_OUTPUT}"
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy --keep-vars 2>&1 | tee "$RUNNER_TEMP/dispatcher-deploy.log"
          echo "deployed=true" >> "${GITHUB_OUTPUT}"
          grep -E "Current Version ID" "$RUNNER_TEMP/dispatcher-deploy.log"

      - name: Capture the current production Pages deployment
        id: pages_previous
        if: steps.stale.outputs.skip != 'true' && steps.runtime.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 --retry 4 --retry-all-errors --retry-delay 2 \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/quant/deployments?env=production&per_page=1")"
          previous_id="$(jq -er 'select(.success == true) | .result[0].id' <<< "${response}")"
          [[ "${previous_id}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          echo "id=${previous_id}" >> "${GITHUB_OUTPUT}"

      - name: Deploy the Cloudflare Pages worker
        id: pages_deploy
        if: steps.stale.outputs.skip != 'true' && steps.runtime.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          pages_dir="$(mktemp -d)"
          cp cloudflare/quant-dashboard/pages_worker.js "${pages_dir}/_worker.js"
          python - "${pages_dir}/_worker.js" "${{ steps.resolve.outputs.sha }}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          revision = sys.argv[2]
          source = path.read_text(encoding="utf-8")
          placeholder = "__QUANT_CODE_COMMIT__"
          if source.count(placeholder) != 1 or len(revision) != 40:
              raise SystemExit("Pages code revision placeholder contract failed")
          path.write_text(source.replace(placeholder, revision), encoding="utf-8", newline="\n")
          PY
          if [[ "$(find "${pages_dir}" -type f | wc -l)" -ne 1 ]]; then
            echo "The Pages staging directory must contain exactly _worker.js." >&2
            exit 1
          fi
          echo "attempted=true" >> "${GITHUB_OUTPUT}"
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy "${pages_dir}" \
            --project-name quant \
            --branch main \
            --commit-hash "${{ steps.resolve.outputs.sha }}" \
            --commit-dirty=false 2>&1 | tee "$RUNNER_TEMP/pages-deploy.log"
          grep -E "Deployment complete" "$RUNNER_TEMP/pages-deploy.log"
          echo "deployed=true" >> "${GITHUB_OUTPUT}"

      - name: Verify the deployed site
        if: steps.stale.outputs.skip != 'true' && steps.runtime.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # pages_worker.js also carries the template placeholder constants
          # (__QUANT_METHODOLOGY_VERSION__/__QUANT_METHODOLOGY_LABEL__) used by
          # the release pipeline; -m1 pins the real constants at the top of the
          # file so the comparison never sees the placeholder text.
          expected_version="$(grep -m1 -oP 'METHODOLOGY_VERSION="\K[^"]+' cloudflare/quant-dashboard/pages_worker.js)"
          expected_label="$(grep -m1 -oP 'METHODOLOGY_LABEL="\K[^"]+' cloudflare/quant-dashboard/pages_worker.js)"
          if [[ -z "${expected_version}" || -z "${expected_label}" ]]; then
            echo "Could not extract the expected methodology version/label from the worker." >&2
            exit 1
          fi
          verified=false
          for attempt in 1 2 3 4 5 6 7 8; do
            methodology="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              --retry 2 --retry-all-errors --retry-delay 2 https://quant.custard.top/api/methodology 2>/dev/null || true)"
            health="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 60 \
              --retry 2 --retry-all-errors --retry-delay 2 'https://quant.custard.top/api/health?deep=1' 2>/dev/null || true)"
            meta="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              --retry 2 --retry-all-errors --retry-delay 2 https://quant.custard.top/api/meta 2>/dev/null || true)"
            homepage="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              --retry 2 --retry-all-errors --retry-delay 2 https://quant.custard.top/ 2>/dev/null || true)"
            ai_page="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              --retry 2 --retry-all-errors --retry-delay 2 https://quant.custard.top/ai-screening 2>/dev/null || true)"
            if [[ "$(jq -r '.methodology_version // empty' <<< "${methodology}" 2>/dev/null || true)" == "${expected_version}" ]] \
              && jq -e '.ok == true and .integrity_checked == true and .integrity_ok == true and (.generation_id | test("^[0-9a-f]{16}$"))' <<< "${health}" >/dev/null 2>&1 \
              && jq -e --arg revision "${{ steps.resolve.outputs.sha }}" '
                (.generation_id | test("^[0-9a-f]{16}$"))
                and .code_commit == $revision
                and .data_source_commit == .source_commit
              ' <<< "${meta}" >/dev/null 2>&1 \
              && grep -qF "${expected_version}" <<< "${homepage}" \
              && grep -qF "AI" <<< "${ai_page}"; then
              verified=true
              echo "Production verification passed on attempt ${attempt}."
              break
            fi
            sleep $((attempt * 3))
          done
          if [[ "${verified}" != "true" ]]; then
            echo "Production did not reach the expected code, data-integrity, homepage and AI-page state after eight attempts." >&2
            exit 1
          fi
          echo "Verified /api/methodology, /api/health, /api/meta, /ai-screening and the homepage."

      - name: Roll back Pages after failed production verification
        if: failure() && steps.pages_deploy.outputs.attempted == 'true' && steps.pages_previous.outputs.id != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --request POST \
            --connect-timeout 10 --max-time 30 --retry 4 --retry-all-errors --retry-delay 2 \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/quant/deployments/${{ steps.pages_previous.outputs.id }}/rollback")"
          jq -e '.success == true' <<< "${response}" >/dev/null
          echo "Rolled Pages back to deployment ${{ steps.pages_previous.outputs.id }}."

      - name: Roll back the dispatcher Worker after a failed deployment
        if: failure() && steps.dispatcher_deploy.outputs.attempted == 'true' && steps.workers_previous.outputs.dispatcher != ''
        working-directory: cloudflare-cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" rollback \
            "${{ steps.workers_previous.outputs.dispatcher }}" \
            --message "Automated rollback after failed website deployment"

      - name: Roll back the refresh Worker after a failed deployment
        if: failure() && steps.refresh_deploy.outputs.attempted == 'true' && steps.workers_previous.outputs.refresh != ''
        working-directory: cloudflare/quant-dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" rollback \
            "${{ steps.workers_previous.outputs.refresh }}" \
            --message "Automated rollback after failed website deployment"
