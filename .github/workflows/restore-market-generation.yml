name: restore retained website market data

on:
  workflow_dispatch:
    inputs:
      generation:
        description: Retained generation to restore
        required: true
        type: string
      expected_current:
        description: Exact current generation to replace
        required: true
        type: string
      manifest_sha256:
        description: Approved SHA-256 of the retained signed manifest
        required: true
        type: string

permissions:
  contents: read

# Share the publication lock: never race a normal market release.
concurrency:
  group: mobile-market-data
  cancel-in-progress: false

jobs:
  restore:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
    env:
      TARGET_GENERATION: ${{ inputs.generation }}
      EXPECTED_CURRENT: ${{ inputs.expected_current }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Restore only the approved current-generation pointer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python tools/restore_market_generation.py switch \
            --generation "$TARGET_GENERATION" --expected-current "$EXPECTED_CURRENT" \
            --manifest-sha256 "$MANIFEST_SHA256"

      - name: Recover the original signed manifest from retained R2 data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/restored-pages/mobile-data"
          npx --yes wrangler@4.118.0 r2 object get \
            "quant-market-data/generations/$TARGET_GENERATION/manifest.json" --remote \
            --file "$RUNNER_TEMP/restored-pages/mobile-data/manifest.json"

      - name: Verify all retained assets and prepare the restored upstream
        run: |
          python tools/restore_market_generation.py prepare \
            --generation "$TARGET_GENERATION" --manifest-sha256 "$MANIFEST_SHA256" \
            --pages-dir "$RUNNER_TEMP/restored-pages"

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/restored-pages

  deploy_upstream:
    needs: restore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Restore the stable upstream for scheduled refreshes
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Confirm both the public site and upstream use the approved generation
        env:
          TARGET_GENERATION: ${{ inputs.generation }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from urllib.request import urlopen
          with urlopen("https://muguett-dby.github.io/quant-buy-signals/mobile-data/manifest.json", timeout=60) as response:
              manifest = response.read()
          assert hashlib.sha256(manifest).hexdigest() == os.environ["MANIFEST_SHA256"], "Upstream manifest mismatch"
          with urlopen("https://quant.custard.top/api/health?deep=1", timeout=60) as response:
              health = json.load(response)
          assert health["generation_id"] == os.environ["TARGET_GENERATION"], "Public generation mismatch"
          assert health["ok"] and health["integrity_ok"], "Public integrity check failed"
          print(json.dumps(health))
          PY
